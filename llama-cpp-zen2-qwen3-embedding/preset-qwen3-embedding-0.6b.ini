version = 1

; Qwen3-Embedding-0.6B on the CPU (Threadripper 3970X, Zen 2). See README.md for the measurements behind these
; settings.

[Qwen/Qwen3-Embedding-0.6B]
; Q8_0 was 11-19 % faster than f16 and retrieved as well (R@10 0.935 for both on the test corpus of README.md).
hf = Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
; Inputs of up to 8192 tokens (the model supports 32768). The KV cache is shared by the slots (kv-unified in
; ../llama-cpp/config.ini).
ctx-size = 8192
; The model is causal, so a long input is processed in several ubatches. 1024-8192 were equally fast; llama.cpp sets
; batch-size = ubatch-size for embeddings anyway.
batch-size = 2048
ubatch-size = 2048
embedding = 1
; https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF#llamacpp
pooling = last
; Off was 2.6 times slower for 500-token texts.
flash-attn = on
load-on-startup = true
; Keep the weights in RAM (CPU-only model)
load-mode = mmap+mlock
; 4 slots: 8 was 2-8 % slower for 500-token texts and as fast for 100-token texts, 2 was 6 % slower for
; 100-token texts.
parallel = 4
; One thread per physical core: 24 threads were 20 % slower.
threads = 32
threads-batch = 32
; Pin the threads to the physical cores 0-31 (32-63 are their SMT siblings): ~4 % faster.
cpu-range = 0-31
cpu-strict = 1
cpu-range-batch = 0-31
cpu-strict-batch = 1
