version = 1

; Qwen3-Embedding-4B on the CPU (Threadripper 3970X, Zen 2). See README.md for the measurements behind these
; settings.

[Qwen/Qwen3-Embedding-4B]
; Q6_K was the fastest type: 300 t/s for 500-token texts vs 295 (Q5_K_M, Q4_K_M), 253 (Q4_0), 210-230 (Q8_0) and
; 200 (f16), as its AVX2 kernels are faster here (the model is compute-bound: 16 threads were 40 % slower). It
; retrieved as well as BF16 on the PaperQA2 corpus (../vllm-rtx-a4000/README.md#embedding-models); the 4-bit types
; were further from FP32 (cosine 0.96-0.99 vs 0.993-0.998).
hf = Qwen/Qwen3-Embedding-4B-GGUF:Q6_K
; Inputs of up to 8192 tokens (the model supports 32768). The KV cache is shared by the slots (kv-unified in
; ../llama-cpp/config.ini).
ctx-size = 8192
; The model is causal, so a long input is processed in several ubatches. 512 was as fast as 2048 (Q8_0); llama.cpp sets
; batch-size = ubatch-size for embeddings anyway.
batch-size = 2048
ubatch-size = 2048
embedding = 1
; https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF#llamacpp
pooling = last
; Off was 2.6 times slower for the 0.6B model with 500-token texts.
flash-attn = on
load-on-startup = true
; Keep the weights in RAM (CPU-only model)
load-mode = mmap+mlock
; 4 slots, as for the 0.6B model (2 was as fast for Q8_0).
parallel = 4
; One thread per physical core: 16 threads (cores 0-15) were 40 % slower.
threads = 32
threads-batch = 32
; Pin the threads to the physical cores 0-31 (32-63 are their SMT siblings): ~4 % faster for the 0.6B model.
cpu-range = 0-31
cpu-strict = 1
cpu-range-batch = 0-31
cpu-strict-batch = 1
