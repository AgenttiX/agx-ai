version = 1

; Configuration for PaperQA2 RAG on 2 x RTX A4000 (16 GB each).
;
; VRAM budget, measured with both models loaded (nvidia-smi; idle, and peak under a mixed 4-request + embedding load):
; GPU0: Qwen3.8 ~11.1 GiB (10848 MiB at ctx 55296, +258 MiB at 65536) + embedding 4432 MiB -> 15829 MiB idle, 15947 MiB peak
; GPU1: Qwen3.8 ~11.0 GiB + embedding 4414 MiB -> 15692 MiB idle, 15810 MiB peak (of 16376 MiB)
; The LLM needs ~120 MiB more per GPU under load, and loading a model needs transient memory beyond its steady-state
; footprint, so ~400 MiB per GPU must stay free at idle for the models to reload reliably after the idle unload.
;
; Context size of Qwen3.8-27B, probed on 2026-09-21 with both models loaded. Each candidate was tested with a cold
; start, two unload/reload cycles through the router API and a mixed load (benchmark/llama_cpp_bench_http.py --mixed):
;   55296, 63488, 65536  stable
;   67584                loads and reloads, but the process dies under load ("CUDA error: out of memory" in cudaGraphInstantiate)
;   69632, 71680         fail to load ("cudaMalloc failed: out of memory" for a ~136 MiB buffer on GPU 0)
; The KV cache costs 32 KiB per token on each GPU (+258 MiB per GPU for +8192 tokens), see the model section below.
; The embedding model's slot count does not affect VRAM use; its context is set by the PaperQA2 chunk size.
;
; Speed results (tg = token generation, pp = prompt processing, acc = accepted MTP draft tokens).
; Newer measurements: benchmark/results/ (benchmark/llama_cpp_bench_http.py).
;
; Qwen3.8-27B UD-Q4_K_M (tensor split, MTP, ctx 55296 at the time, 4 slots) + Qwen3-Embedding-8B Q6_K:
; - Single request: tg 50-67 t/s, acc 50-70 %
; - 4 concurrent requests with 11k-token prompts, while embedding 2 x 30k tokens:
;   pp 144-295 t/s and tg 8-33 t/s per request, ~76 t/s in total, ~90 s wall time per request
; - Embeddings during the above: 2 x 30k tokens in ~50 s (~600 t/s per batch)
;
; Previous combination: Gemma 4 31B QAT UD-Q4_K_XL (tensor split, MTP, ctx 24576, 4 slots) + Qwen3-Embedding-4B Q6_K:
; - Single request: tg 64-75 t/s, acc 65-85 %, pp 890 t/s for a 4.8k-token prompt
; - 4 concurrent requests with 2.8k-token prompts: tg 28-39 t/s per request, ~136 t/s in total
; - The same while embedding 2 x 30k tokens: pp 111-141 t/s and tg 22-31 t/s per request, ~109 t/s in total
; - Embeddings during the above: 2 x 30k tokens in ~29 s (~1000 t/s per batch)
; Gemma 4 31B had a larger and faster-accepted MTP draft, but its sliding-window KV cache (~900 MiB per slot)
; and the ~80 KiB per token global-attention KV cache limited the context size to 24576 tokens.

[Qwen/Qwen3.8-27B]
hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
; Tensor split requires flash attention and a non-quantized KV cache.
cache-type-k = f16
cache-type-v = f16
; Only 16 of the 64 layers use a KV cache, which takes 64 KiB per token (2 GiB per 32768 tokens),
; i.e. 32 KiB per token on each GPU with the tensor split (measured 2026-09-21: +258 MiB per GPU for +8192 tokens).
; The recurrent state of the other layers takes ~450 MiB per slot regardless of the context size.
; 65536 is the largest stable context with both models loaded; see the VRAM budget and the probe at the top of this file.
ctx-size = 65536
fit = off
flash-attn = on
; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
; image-min-tokens = 1024
; With mmap the models are reloaded from the page cache in seconds after an idle unload, whereas dio takes ~50 s.
load-mode = mmap
load-on-startup = true
n-gpu-layers = all
no-mmproj-offload = 1
; PaperQA2 sends up to 4 concurrent requests by default (answer.max_concurrent_requests).
parallel = 4
; init: chat template supports preserving reasoning, consider enabling it via --reasoning-preserve
; reasoning-preserve = true
split-mode = tensor
tensor-split = 1,1
spec-draft-n-max = 2
spec-type = draft-mtp
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

[Qwen/Qwen3-Embedding-8B]
; Q6_K instead of Q8_0, as Q8_0 would take ~1.7 GiB more VRAM and reduce the LLM context by ~25k tokens.
hf = Qwen/Qwen3-Embedding-8B-GGUF:Q6_K
; An embedding input has to fit in a single physical batch.
; PaperQA2 uses 5000-character chunks (parsing.reader_config chunk_chars) by default, which is ~1100 tokens of
; PDF text and up to ~2000 tokens for equation-heavy pages.
; The compute buffer is ~600 MiB per 1024 tokens of ubatch-size, as it includes the logits for the whole vocabulary.
batch-size = 2048
; The KV cache (ctx-size) is shared by the parallel slots (kv-unified in config.ini). A 5000-character chunk of
; PDF text is ~1100 tokens, but reference lists and tables tokenise to ~3500 tokens, so two concurrent chunks
; exceeded a 4096-token cache ("Context size has been exceeded", 2026-09-19). The embedding model therefore runs
; with a single slot and a context that holds any 5000-character chunk. A single input larger than ubatch-size
; is processed in several batches, as the model is causal. Raising the context for more slots would cost
; ~150 MiB of VRAM per 1024 tokens, which is not available with both models loaded.
ctx-size = 5120
embedding = 1
fit = off
flash-attn = on
load-mode = mmap
load-on-startup = true
n-gpu-layers = all
parallel = 1
; https://huggingface.co/Qwen/Qwen3-Embedding-8B-GGUF#llamacpp
pooling = last
; Tensor split crashes for embeddings:
; ggml-backend-meta.cpp:1914: GGML_ASSERT(offset == 0) failed
split-mode = layer
; The output layer and its compute buffer are on the last GPU, so give the first GPU more layers.
tensor-split = 4,3
ubatch-size = 2048
