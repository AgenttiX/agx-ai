# llama.cpp router server for PaperQA2 on the Big Machine (2x RTX A4000, 16 GB each).
# Models, their settings and the VRAM/context notes are in preset.ini; server-wide settings in config.ini.
services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-cpp
    env_file:
      - ./llama-cpp.env
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - /home/makimika/.cache/huggingface/hub:/root/.cache/huggingface/hub
      - ./config.ini:/etc/llama.cpp/config.ini:ro
      - ./preset.ini:/etc/llama.cpp/preset.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              count: all
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9931/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
