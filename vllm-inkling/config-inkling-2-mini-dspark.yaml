# vllm serve --config for Inkling 2 Mini on the RTX 3090 (sm_86, 24 GB) of agx-z2e, with the image of ./Dockerfile
# (the vLLM nightly with the patches of README.md). Benchmarks: README.md. With the DSpark block drafter: chats 22 %
# and code edits 2.8 times as fast as config-inkling-2-mini.yaml, with 58 % of its context.
# Checkpoint (thinkingmachines/Inkling-2-Mini, 19.5 GB): 24 layers, of which layers 6-17 run 3 times (48 layer visits),
# 128 routed experts (top 8) in NVFP4 (layers 0-19) and MXFP8 (layers 20-23), everything else BF16. 18.3 GiB on the
# GPU without the vision tower, 16.14 GiB with the int8 weights below (+0.7 GiB for the drafter).
model: thinkingmachines/Inkling-2-Mini
served-model-name: thinkingmachines/Inkling-2-Mini
# Images with the vision encoder on the CPU (INKLING2_VISION_DEVICE=cpu in docker-compose.yml,
# inkling-cpu-vision.patch), which takes no VRAM (on the GPU: 0.6 GiB, ~19k tokens of context). Up to 64 images per
# request, as agent sessions collect screenshots, scaled down to 1 megapixel (a 1280x960 image: 794 tokens, 4 s). No
# encoder profiling. vLLM's Inkling 2 model takes no videos; llama.cpp does
# (../llama-cpp-rtx3090/preset-inkling-2-mini.ini).
limit-mm-per-prompt: {"image": 64}
mm-processor-kwargs: {"max_pixels": 1048576}
skip-mm-profiling: true
# Peak 21728 MiB in code edits and with a 52588-token prompt (max. 60032 tokens).
max-model-len: 57344
# 58997 tokens: ~32 KiB per token for the 8 full-attention caches (layers 5, 11 and 17 x 3 passes, 23; BF16), plus
# the drafter's caches and a fixed part for the 40 sliding-window caches (window 1024) and the short-conv states, which
# grows with the prefill chunk. Set explicitly instead of gpu-memory-utilization, which vLLM still checks against the
# free memory at startup.
kv-cache-memory-bytes: 3620000000
gpu-memory-utilization: 0.8
# Inkling 2 supports only BF16 KV caches below SM12x (auto = bf16): its FP8 KV cache reads E4M3 with
# cvt.rn.f16x2.e4m3x2 and writes it with Triton's fp8e4nv type, both SM89+.
kv-cache-dtype: auto
# The prefill chunk. Each sliding-window and short-conv cache reserves its window plus a chunk per sequence: with 2048,
# 8192 tokens of context needed 4.06 GiB of KV cache, with 512 1.4 GiB. Prompt processing is still ~3600-4300 t/s.
max-num-batched-tokens: 512
# One request at a time, as for llama.cpp (parallel = 1).
max-num-seqs: 1
enable-prefix-caching: true
# tokenizer-mode inkling (the native chat renderer; there is no Jinja chat template) is selected automatically.
reasoning-parser: inkling
enable-auto-tool-choice: true
tool-call-parser: inkling
# Sampling: generation_config.json of the model (temperature 1.0).
# The DSpark drafter of the checkpoint (mtp.safetensors): a block of 7 drafted tokens per step, the only length vLLM
# accepts (the checkpoint's block size - 1). Acceptance 14-23 % in chats and 73 % in code edits. It shares the int8 LM
# head and embedding of the model.
speculative-config: {"method": "dspark", "num_speculative_tokens": 7, "draft_sample_method": "probabilistic"}
# The patches' options (inkling-int8-cpu-experts.patch; part of the compile cache key):
# - inkling2_int8_weights: the BF16 attention projections (qkvr, wo_ud), the LM head and the token embedding in int8
#   with one scale per output row (1.46 GiB less, decoding 1.35 times as fast; perplexity +0.2 %: 2.2851 -> 2.2896 on
#   12837 tokens of text and code).
additional-config: {"inkling2_int8_weights": true}
