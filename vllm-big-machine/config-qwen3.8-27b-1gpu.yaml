# vllm serve --config for Qwen3.8-27B on one GPU: configuration 5. Benchmarks: README.md
# GPTQ int4 (group size 128) with int4 embedding and lm_head, 13.1 GiB on the GPU without the vision tower. The
# quantized embedding needs vllm-big-machine.patch (see Dockerfile). The mtp-int8 revision has the MTP head
# in int8; it is not used, as it would leave room for much less context.
model: JRamirez-UAB/Qwen3.8-27B-GPTQ-W4A16-embed-int4-24GB
revision: mtp-int8
served-model-name: Qwen/Qwen3.8-27B
# Do not load the vision tower (0.9 GiB), which would not fit.
language-model-only: true
# The maximum with the KV cache below.
max-model-len: 40960
# Set explicitly instead of gpu-memory-utilization, whose profiling leaves less for the KV cache.
kv-cache-memory-bytes: 1950000000
# FlashAttention 2 (the default on Ampere) supports no quantized KV cache. int8 with a scale per token and head
# (the format closest to llama.cpp's q8_0) with Triton attention fits twice the context of BF16.
kv-cache-dtype: int8_per_token_head
attention-backend: TRITON_ATTN
# The prefill chunk. Larger chunks need more activation memory.
max-num-batched-tokens: 1024
# CUDA graphs only for decoding and a few batch sizes: capturing the default sizes takes several hundred MiB.
compilation-config: {"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1, 2, 4]}
# Every sequence needs its own recurrent state for the 48 Gated DeltaNet layers.
max-num-seqs: 4
enable-prefix-caching: true
# No CPU KV offloading: it needs GPU memory too, which made the server run out of memory on the first request
# (Qwen with 2.1 GB of KV cache), and it does not speed up PaperQA2 (see README.md).
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
# Sampling: generation_config.json of the model (temperature 1.0, top-k 20, top-p 0.95), as recommended by Qwen.
