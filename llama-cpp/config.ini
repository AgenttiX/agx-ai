version = 1

; Server-wide settings of the llama.cpp router for all configurations except ../llama-cpp-rtx3070 (config-dual.ini)
; and ../llama-cpp-rtx-a4000 (its own).
; The models and their settings are in the preset.ini files of the configurations.
[*]
host = 0.0.0.0
kv-unified = 1
; Only one model is loaded at a time: the router unloads the loaded model when another one is requested.
models-max = 1
models-preset = /etc/llama.cpp/preset.ini
no-ui = 1
port = 9931
; verbosity = 3
