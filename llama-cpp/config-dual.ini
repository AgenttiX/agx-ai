version = 1

; Server-wide settings of the llama.cpp router with two models loaded at a time, for ../llama-cpp-rtx3070. The same as
; config.ini otherwise.
; The models and their settings are in the preset.ini files of the configurations.
[*]
host = 0.0.0.0
kv-unified = 1
; Two models are loaded at a time: the router unloads one of them when a third one is requested.
models-max = 2
models-preset = /etc/llama.cpp/preset.ini
no-ui = 1
port = 9931
; verbosity = 3
