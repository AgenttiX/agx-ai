version = 1

[HauhauCS/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP]
hf = HauhauCS/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP:Q4_K_M
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
# q8_0 KV cache lets all layers fit on the RTX 3090, which doubles the generation speed.
cache-type-k = q8_0
cache-type-v = q8_0
# With all layers and q8_0 KV, 50000 peaks at 23.9 of 24.6 GiB, which is too tight with a desktop.
# ctx-size = 50000
ctx-size = 32768
fit = off
# The default "auto" already enables flash attention on CUDA (same speed as "on").
flash-attn = on
# load-mode = dio
load-mode = none
load-on-startup = true
n-gpu-layers = all
# With the f16 KV cache and ctx-size 50000
# n-gpu-layers = 50
no-mmproj-offload = 1
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp

# Benchmarks on 2026-09-26, RTX 3090 (desktop session using ~1.2 GiB), build b10689,
# benchmark/llama_cpp_bench_http.py (256 generated tokens, MTP on), peak VRAM includes the desktop:
# | Setup                                    | Generation | Prompt       | Peak VRAM |
# | ngl 50, f16 KV, ctx 50000 (previous)     | 24.1 t/s   | 677 t/s 16k  | 22360 MiB |
# | ngl 57, q8_0 KV, ctx 50000               | 35.9 t/s   | 654 t/s 45k  | 22834 MiB |
# | ngl all, q8_0 KV, ctx 50000              | 49.7 t/s   | 728 t/s 45k  | 23872 MiB |
# | ngl all, q8_0 KV, ctx 32768 (this)       | 48.5 t/s   | 780 t/s 30k  | 22983 MiB |
