version = 1

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; With ubatch-size 2048, 200000 peaks at 23.7 of 24.6 GiB, which is too tight with a desktop.
; ctx-size = 200000
ctx-size = 163840
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
; Off is 14-22 % slower in prompt processing and 33 % slower in generation at depth 16384.
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
parallel = 2
spec-draft-n-max = 2
spec-type = draft-mtp
; Speeds up prompt processing by 18-21 % compared to the default 512 (1024: +11 %).
ubatch-size = 2048
; A q8_0 KV cache is not needed here, and it is slower (tg128 at depth 16384: 122 vs 142 t/s).
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

; Benchmarks on 2026-09-26, RTX 3090 (desktop session using ~1.2 GiB), build b10689,
; benchmark/llama_cpp_bench_http.py (256 generated tokens, MTP on, 2 slots), peak VRAM includes the desktop:
; | Setup                     | Generation | Prompt 45k | 2 concurrent | Peak VRAM |
; | ub 512, ctx 200000        | 196.0 t/s  | 2973 t/s   | 184 t/s      | 21767 MiB |
; | ub 1024, ctx 200000       | 193.5 t/s  | 3291 t/s   | 204 t/s      | 22358 MiB |
; | ub 2048, ctx 200000       | 194.6 t/s  | 3523 t/s   | 206 t/s      | 23690 MiB |
; | ub 2048, ctx 163840 (this)| 194.0 t/s  | -          | 204 t/s      | 22780 MiB |
; | ub 2048, ctx 131072       | 195.6 t/s  | 3564 t/s   | 205 t/s      | 21860 MiB |
; | ub 2048, ctx 100000       | 196.1 t/s  | 3604 t/s   | 206 t/s      | 21022 MiB |
; The KV cache takes ~26 MiB per 1000 tokens of context. With ctx 163840, a 150000-token prompt
; was processed at 1997 t/s without running out of memory (peak VRAM above is from that run).
