version = 1

[Qwen/Qwen3.8-27B]
hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
ctx-size = 50000
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
; Off is 20 % slower in prompt processing and 30 % slower in generation at depth 16384.
flash-attn = on
; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
; image-min-tokens = 1024
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; init: chat template supports preserving reasoning, consider enabling it via --reasoning-preserve
; reasoning-preserve = true
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; ubatch-size 1024 was tested: +2.6 % prompt processing (within noise) for +360 MiB, so it is not used.
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

; Benchmarks on 2026-09-26, RTX 3090 (desktop session using ~1.2 GiB), build b10689,
; benchmark/llama_cpp_bench_http.py (256 generated tokens, MTP on, 2 slots), peak VRAM includes the desktop:
; | Setup          | Generation | Prompt 45k | 2 concurrent | Peak VRAM |
; | ub 512 (this)  | 63.8 t/s   | 919 t/s    | 63.3 t/s     | 22331 MiB |
; | ub 1024        | 62.3 t/s   | 943 t/s    | 63.1 t/s     | 22689 MiB |
; llama bench pp2048/tg128 at depth 16384: fa on 1031/36.8 t/s, fa auto 1003/33.6 t/s, fa off 827/25.7 t/s.
