version = 1

[google/gemma-4-31b-qat]
hf = unsloth/gemma-4-31B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; q8_0 KV cache lets all 60 layers fit on the RTX 3090 at this context size, which doubles the generation speed.
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 50000
; ctx-size = 100000
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on"). Off is 20-50 % slower.
flash-attn = on
; load-mode = dio
load-mode = none
load-on-startup = true
; Total layers = 60
n-gpu-layers = all
; With the f16 KV cache, only 53 layers fit
; n-gpu-layers = 53
no-mmproj-offload = 1
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; 1024 speeds up prompt processing by 6 % vs the default 512 for +530 MiB.
; 2048 is +9 % vs 512 (+3 % vs 1024) but peaks at 23.6 of 24.6 GiB, too tight with a desktop.
ubatch-size = 1024

; Benchmarks on 2026-09-25/26, RTX 3090 (desktop session using ~1.2 GiB), build b10689,
; benchmark/llama_cpp_bench_http.py (256 generated tokens, MTP on), peak VRAM includes the desktop:
; | Setup                                 | Generation | Prompt 16k | Prompt 45k | Peak VRAM |
; | ngl 53, f16 KV (previous preset)      | 29.1 t/s   | 801 t/s    | -          | 21505 MiB |
; | ngl all, q8_0 KV, ub 512              | 63.1 t/s   | 971 t/s    | 773 t/s    | 22146 MiB |
; | ngl all, q8_0 KV, ub 1024 (this)      | 62.1 t/s   | -          | 817 t/s    | 22620 MiB |
; | ngl all, q8_0 KV, ub 2048             | 62.4 t/s   | -          | 845 t/s    | 23645 MiB |
; llama bench, ngl 53, pp2048/tg128 at depth 16384: fa on 660/13.2 t/s, fa off 530/11.6 t/s.
