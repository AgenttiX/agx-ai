version = 1

; See README.md for the benchmarks and the reasoning behind these settings.

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; 32768 would need ub 512, which makes prompts ~25 % slower.
ctx-size = 24576
fit = off
flash-attn = on
load-on-startup = true
n-gpu-layers = all
; The vision encoder (mmproj, 1.2 GB) runs on the CPU, as it does not fit in VRAM.
no-mmproj-offload = 1
; Keep everything but the Q/K/V attention projections in RAM (host buffer), from where they are
; copied to the MX150 for prompt processing:
; the FFNs and MoE experts (ffn_), the embeddings, which are also the output matrix (token_embd),
; and the attention output projections (attn_output).
override-tensor = ffn_|token_embd|output=CPU
parallel = 1
; MTP did not pay off on this CPU.
; spec-draft-n-max = 2
; spec-type = draft-mtp
; Generation (non-repacked weights) is fastest with 4 threads, prompt processing with 8.
; For mostly short chats, "no-host = true" and "threads = 8" generate faster, but make prompts ~3.7x slower.
threads = 4
threads-batch = 8
; Larger ubatches make prompt processing faster, but do not fit in VRAM with this context size.
ubatch-size = 1024
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95
