version = 1

[*]
host = 0.0.0.0
kv-unified = 1
; The 26B-A4B takes ~15.6 GB of RAM and almost all of the VRAM, so only one model fits at a time.
; The router also lists the other models in the Hugging Face cache, and unloads the loaded model when one of them is requested.
models-max = 1
models-preset = /etc/llama.cpp/preset.ini
no-ui = 1
port = 9931
; verbosity = 3
