name: Publish vLLM gfx906 Docker image
on:
  push:
    branches: [main]
    paths:
      - "vllm-radeon-vii/Dockerfile"
      - "vllm-radeon-vii/vllm-gfx906.patch"
      - ".github/workflows/deploy-docker-vllm-radeon-vii.yml"
  workflow_dispatch:
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The base image is 11 GB uncompressed, more than the free space of the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # QEMU is not needed, as the image is built only for x86-64 (the base image is available only for it).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/vllm-gfx906
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha
          # The Dockerfile is in a subdirectory of the repository.
          context: "{{defaultContext}}:vllm-radeon-vii"
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/vllm-gfx906
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
