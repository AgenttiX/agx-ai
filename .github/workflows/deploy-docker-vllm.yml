name: Publish vLLM Docker image
on:
  push:
    branches: [main]
    paths:
      - "vllm/Dockerfile"
      - "vllm/vllm.patch"
      - ".github/workflows/deploy-docker-vllm.yml"
  workflow_dispatch:
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The base image is ~10 GB compressed per platform; after this, the runner has ~106 GB free (2026-10-11).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The base image is available for x86-64 and ARM64. QEMU emulates ARM64 for the only build step, the patch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/vllm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha
          # The Dockerfile is in a subdirectory of the repository.
          context: "{{defaultContext}}:vllm"
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/vllm
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
