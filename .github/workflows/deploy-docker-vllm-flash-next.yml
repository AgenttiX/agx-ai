name: Publish vLLM Qwen3.8-Flash-Next Docker image
# The single-RTX-3090 runtime of https://github.com/DominikBucko/qwen38-flash-next-3090 (a vLLM build with CPU expert
# kernels for Qwen3.8-Flash-Next), built from a pinned commit of that repository. See ../../vllm-agx-z2e/README.md.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-docker-vllm-flash-next.yml"
  workflow_dispatch:
env:
  # The commit of DominikBucko/qwen38-flash-next-3090 to build (v0.1.0 and README updates, 2026-10-11).
  # Its Dockerfile is based on a release image of DominikBucko/qwen38-flash-next-2x3090 pinned by digest.
  SOURCE_REPOSITORY: DominikBucko/qwen38-flash-next-3090
  SOURCE_COMMIT: 10b24c282f59348037096a2259d3ba0948f1b202
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The base image is ~29 GB uncompressed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - name: Check out the runtime
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/vllm-flash-next
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/docker/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/vllm-flash-next
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
