name: Publish vLLM Qwen3.8-Flash-Next Docker image
# The Qwen3.8-Flash-Next runtime of DominikBucko/qwen38-flash-next-3090 with image and video input (vision tower on the CPU),
# see ../../vllm-flash-next/README.md.
on:
  push:
    branches: [main]
    paths:
      - "vllm-flash-next/Dockerfile"
      - "vllm-flash-next/cpu_vision.py"
      - "vllm-flash-next/flash-next.patch"
      - "vllm-flash-next/vllm-mm.patch"
      - ".github/workflows/deploy-docker-vllm-flash-next.yml"
  workflow_dispatch:
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The base image is ~20 GB uncompressed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/vllm-flash-next
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha
          # The Dockerfile is in a subdirectory of the repository.
          context: "{{defaultContext}}:vllm-flash-next"
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/vllm-flash-next
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
