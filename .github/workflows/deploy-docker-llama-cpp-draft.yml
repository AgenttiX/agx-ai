name: Publish the llama.cpp Docker image with fast rollback for draft models
on:
  push:
    branches: [main]
    paths:
      - "llama-cpp-draft/**"
      - ".github/workflows/deploy-docker-llama-cpp-draft.yml"
  workflow_dispatch:
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA (RTX 3090)
          - image: llama-cpp-draft
            dockerfile: Dockerfile
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      contents: read
      packages: write
    steps:
      # The CUDA build image is large.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # The Dockerfiles are in a subdirectory of the repository.
          context: "{{defaultContext}}:llama-cpp-draft"
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
