version = 1

; EmbeddingGemma 2 (text only) on the CPU (Threadripper 3970X, Zen 2). See README.md for the measurements behind
; these settings.

[google/embeddinggemma-2]
; BF16 was as fast as Q8_0 on this CPU (the speed is limited by the compute of the attention and the small matrices,
; not by the memory bandwidth), so the unquantized weights are used.
hf = ggml-org/embeddinggemma-2-GGUF:BF16
; The context of the model card. The KV cache is shared by the slots (kv-unified in ../llama-cpp/config.ini).
ctx-size = 8192
; The model is not causal, so an input has to fit into a single ubatch: up to the full context.
batch-size = 8192
ubatch-size = 8192
embedding = 1
; Flash attention (auto = on): off was 2.4 times slower for 500-token texts.
flash-attn = on
load-on-startup = true
; 8 slots: the texts of a request are processed together in the same ubatch. 4 was as fast for 500-token texts and
; 10 % slower for 100-token texts, 16 slower for 500-token texts.
parallel = 8
; One thread per physical core. 64 threads (SMT) was 2.5-4 times slower, 16 threads 30 % slower.
threads = 32
threads-batch = 32
; Pin the threads to the physical cores 0-31 (32-63 are their SMT siblings): ~3 % faster.
cpu-range = 0-31
cpu-strict = 1
cpu-range-batch = 0-31
cpu-strict-batch = 1
