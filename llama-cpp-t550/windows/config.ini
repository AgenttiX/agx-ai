version = 1

; Server-wide settings for llama.cpp running natively on Windows (../../llama-cpp-windows/start-llama-server.ps1
; passes them as arguments). The same as ../config.ini for Docker, except for the paths and the host.

[*]
; Only local connections. For access from the network, use 0.0.0.0 and allow llama-server.exe in the Windows firewall.
host = 127.0.0.1
kv-unified = 1
; Each model takes almost all of the VRAM, so only one is loaded at a time.
; Requesting the other model unloads the loaded one.
models-max = 1
; The same models and settings as with Docker. Relative to this directory.
models-preset = ../preset.ini
no-ui = 1
port = 9931
; verbosity = 3
