version = 1

; The VRAM budget, context size probes, speed results and other findings are in README.md.

[google/gemma-4-e4b-qat]
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
; Peak 3869 MiB with a 67.0k-token prompt; the limit is ~3940 MiB (see README.md).
ctx-size = 69632
fit = off
; Requires ubatch-size = 256 with MTP.
flash-attn = on
load-on-startup = true
n-gpu-layers = all
; The vision and audio encoder would take ~1 GB of VRAM.
no-mmproj-offload = 1
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; Workaround for loading the MTP drafter (https://github.com/ggml-org/llama.cpp/issues/29044): when the model has
; filled the VRAM, the driver reports 0 bytes free, and the drafter fails to load ("invalid vector subscript" natively,
; "vector::_M_range_check" in WSL 2). Needed both natively and in Docker/WSL 2, and no difference in speed (single GPU).
tensor-split = 1
; The default of 512 crashes with flash attention and MTP on long prompts.
ubatch-size = 256
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; The prompt cache in RAM (8 GiB by default) would push the MoE experts out of the page cache of the WSL VM.
cache-ram = 0
; q8_0 K and V caches are within the noise of f16 in quality and as fast, and save ~480 MiB of VRAM at ctx 50k.
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 3873 MiB with a 71k-token prompt; the limit is ~3940 MiB (see README.md).
ctx-size = 73728
fit = off
flash-attn = on
load-on-startup = false
; All MoE experts (12 GiB) in RAM, everything else (1.3 GiB) and the KV cache in VRAM.
; For prompts, llama.cpp copies the experts to the GPU for each ubatch ("op offload").
n-cpu-moe = 30
n-gpu-layers = all
; The vision encoder (1.1 GiB) on the CPU. Natively on Windows, the RAM is sufficient for it.
no-mmproj-offload = 1
; Docker/WSL 2: the vision encoder does not fit in the RAM of the WSL VM (15.5 GiB) together with the experts:
; generation was 2x slower with it (9.3 vs 19.7 t/s), as the experts were re-read from disk.
; no-mmproj = true
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; Workaround for loading the MTP drafter (https://github.com/ggml-org/llama.cpp/issues/29044): when the model has
; filled the VRAM, the driver reports 0 bytes free, and the drafter fails to load ("invalid vector subscript" natively,
; "vector::_M_range_check" in WSL 2). Needed both natively and in Docker/WSL 2, and no difference in speed (single GPU).
tensor-split = 1
; Fastest for generation; 16 threads (including the efficiency cores) is much slower.
threads = 8
; Prompt processing: 1024 is 30 % faster than 512, and 2048 is not faster.
ubatch-size = 1024
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat
temp = 1.0
top-k = 64
top-p = 0.95

[qwen/qwen3.5-4b]
; UD-Q4_K_XL: mean KLD 0.013 against Q8_0 (Q4_0 0.033, IQ4_NL 0.024, UD-Q5_K_XL 0.005, which is ~15 % slower;
; see README.md). No MTP layer in the GGUF.
hf = unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL
; Only 8 of the 32 layers have a KV cache (32 KiB per token with f16); the rest are Gated DeltaNet (50 MiB state).
; Weights 2767 MiB + KV 896 MiB + compute 134 MiB; peak 3835 MiB with a 26.5k-token prompt (limit ~3940 MiB).
; With q8_0 K and V caches, ~40000 would fit.
ctx-size = 28672
fit = off
flash-attn = on
load-on-startup = false
n-gpu-layers = all
; The vision encoder (0.6 GiB) on the CPU.
no-mmproj-offload = 1
parallel = 1
tensor-split = 1
; The compute buffer is mostly the logits of the 248k-token vocabulary (~1 MiB per ubatch token), and 128 processed
; prompts faster than 256 (147-151 vs 135 t/s).
ubatch-size = 128
; Model parameters
; https://unsloth.ai/docs/models/qwen3.5
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

[qwen/qwen3.5-9b]
; UD-Q4_K_XL: mean KLD 0.0086 against Q8_0; UD-IQ3_XXS (3.7 GiB, the largest that fits entirely on the GPU) 0.080,
; i.e. clearly lossy (see README.md). No MTP layer in the GGUF.
hf = unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
; q8_0 K and V caches (within the noise of f16 for Qwen models, see ../llama-cpp/OPTIMIZATIONS.md) leave room
; for 16384 tokens with 20 layers on the GPU: weights 3393 MiB + KV 170 MiB + compute 130 MiB.
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 16384
fit = off
flash-attn = on
load-on-startup = false
; 20 of 32 layers on the GPU (~133 MiB each), the other 12 on the CPU, which limits generation (the GPU waits).
; 18 / 19 / 20 layers: 4.1 / 4.5 / 5.3 t/s; f16 caches would allow 20 layers with only 8192 tokens.
n-gpu-layers = 20
; The vision encoder (0.9 GiB) on the CPU.
no-mmproj-offload = 1
parallel = 1
tensor-split = 1
threads = 8
ubatch-size = 128
; Model parameters
; https://unsloth.ai/docs/models/qwen3.5
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95
