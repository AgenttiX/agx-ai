version = 1

; Configuration for the NVIDIA T550 Laptop GPU (4 GB, Turing TU117, 30 W) under Docker Desktop with WSL 2 on Windows.
;
; VRAM budget (Windows "GPU Adapter Memory" performance counters, as nvidia-smi does not show the shared memory):
; - Windows lets the model use up to ~3940 MiB of the 4096 MiB dedicated memory. Beyond that, WDDM silently moves
;   memory to shared system memory ("Shared Usage" grows) instead of failing, and generation slows down: with flash
;   attention off, ctx 32768 put 1100 MiB into shared memory and ran at 18 t/s instead of 30 t/s.
;   Check for this with (Get-Counter "\GPU Adapter Memory(*)\Shared Usage").CounterSamples in PowerShell.
;   ~150 MiB of shared usage is normal, as the pinned CUDA_Host buffers count as shared memory.
; - Gemma 4 E4B keeps its per-layer embeddings (2288 MiB) on the CPU, so only 3026 MiB of the 4.9 GB UD-Q4_K_XL
;   file goes to the GPU. The MTP drafter takes ~110 MiB and the compute buffers ~70 MiB with ubatch-size 256.
;   The global-attention KV cache costs 16 KiB per token (512 MiB at ctx 32768) and the sliding-window cache ~30 MiB.
; - At ctx 24576: 3677 MiB after loading, 3815 MiB peak for a 22.9k-token prompt, nothing moved to shared memory.
;
; Context size, probed on 2026-09-24:
;   10000   stable, 3565 MiB peak with an 8.8k-token prompt
;   24576   stable, 3815 MiB peak with a 22.9k-token prompt; two unload/reload cycles through the router API
;   32768   works (29.8k-token prompt at 91 t/s, found a "secret word" in the middle), but its 3941 MiB peak is at
;           the limit above, leaving no margin for other programs that use the GPU
;   45056 with cache-type-k/v = q8_0: already 3927 MiB after loading and memory moving to shared memory
;           (prompt processing 47 t/s). With flash attention, the quantized cache needs f16 conversion buffers,
;           so it saves much less than half of the KV cache.
;
; Other findings:
; - E4B UD-Q4_K_XL was chosen over E2B, as it fits with ctx > 20000. E2B UD-Q4_K_XL takes only 1482 MiB of VRAM
;   for the weights and would allow a much larger context, but it is a much weaker model.
; - flash-attn = on with MTP and the default ubatch-size 512 crashes on prompts longer than a few thousand tokens,
;   as the CUDA memory pool cannot grow: "CUDA error: device not ready" in cuMemSetAccess (ggml_cuda_pool_vmm::alloc).
;   ubatch-size = 256 fixes this. flash-attn = off also works, but needs ~230 MiB more VRAM (the V cache is padded
;   to 1024 due to the different head sizes) and processed an 8.8k-token prompt at 52 t/s instead of 84 t/s
;   (both measured with a cold CUDA JIT cache, see docker-compose.yml).
; - Without tensor-split = 1, the MTP drafter fails to load on WSL 2:
;   "vector::_M_range_check: __n (which is 1) >= this->size() (which is 1)"
;   https://github.com/ggml-org/llama.cpp/issues/29044
; - Loading takes ~2 minutes, as the ~6 GB of model and mmproj files are read through the Windows file system.
;
; Speed results (build b11151, tg = token generation, pp = prompt processing, acc = accepted MTP draft tokens),
; measured on 2026-09-24 with benchmark/llama_cpp_bench_http.py (results in benchmark/results/vxl-ws027.jsonl):
; - E4B UD-Q4_K_XL, MTP spec-draft-n-max 2, ctx 24576:
;   - Single request, 256 tokens: tg 37.9 t/s, acc 52 %
;   - pp 153 t/s for a 4096-token prompt, 123 t/s for a 22.9k-token prompt
;   - Chat request with a 22.9k-token prompt: tg 27.3 t/s, acc 58 %
; - spec-draft-n-max 1: tg 36.6 t/s (acc 77 %), spec-draft-n-max 3: tg 32.5 t/s (acc 40 %)
; - llama bench on the same GGUF without MTP (-fa 1): pp512 162 t/s, pp4096 151 t/s, tg128 25 t/s,
;   i.e. MTP speeds up generation by ~50 %.

[google/gemma-4-e4b]
hf = unsloth/gemma-4-E4B-it-GGUF:UD-Q4_K_XL
; See the context probe above.
ctx-size = 24576
fit = off
; Requires ubatch-size = 256 with MTP, see above.
flash-attn = on
load-on-startup = true
n-gpu-layers = all
; The vision and audio encoder would take ~1 GB of VRAM.
no-mmproj-offload = 1
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; Workaround for loading the MTP drafter on WSL 2, see above.
tensor-split = 1
ubatch-size = 256
; Model parameters
; https://unsloth.ai/docs/models/gemma-4
temp = 1.0
top-k = 64
top-p = 0.95
