version = 1

; The VRAM budget, context size probes, speed results and other findings are in README.md.

[google/gemma-4-e4b-qat]
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
; Peak 3869 MiB with a 67.0k-token prompt; the limit is ~3940 MiB (see README.md).
ctx-size = 69632
fit = off
; Requires ubatch-size = 256 with MTP.
flash-attn = on
load-on-startup = true
n-gpu-layers = all
; The vision and audio encoder would take ~1 GB of VRAM.
no-mmproj-offload = 1
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; Workaround for loading the MTP drafter on WSL 2: https://github.com/ggml-org/llama.cpp/issues/29044
tensor-split = 1
; The default of 512 crashes with flash attention and MTP on long prompts.
ubatch-size = 256
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; The prompt cache in RAM (8 GiB by default) would push the MoE experts out of the page cache of the WSL VM.
cache-ram = 0
; q8_0 K and V caches are within the noise of f16 in quality and as fast, and save ~480 MiB of VRAM at ctx 50k.
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 3873 MiB with a 71k-token prompt; the limit is ~3940 MiB (see README.md).
ctx-size = 73728
fit = off
flash-attn = on
; Loaded on request, which unloads the E4B (models-max = 1 in config.ini).
load-on-startup = false
; All MoE experts (12 GiB) in RAM, everything else (1.3 GiB) and the KV cache in VRAM.
; For prompts, llama.cpp copies the experts to the GPU for each ubatch ("op offload").
n-cpu-moe = 30
n-gpu-layers = all
; The vision encoder (1.1 GiB) does not fit in the RAM of the WSL VM (15.5 GiB) together with the experts:
; generation was 2x slower with it (9.3 vs 19.7 t/s), as the experts were re-read from disk.
; With more memory for the VM (see README.md), replace this with "no-mmproj-offload = 1" to run it on the CPU.
no-mmproj = true
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
; Workaround for loading the MTP drafter on WSL 2: https://github.com/ggml-org/llama.cpp/issues/29044
tensor-split = 1
; Fastest for generation; 16 threads (including the efficiency cores) is much slower.
threads = 8
; Prompt processing: 1024 is 30 % faster than 512, and 2048 is not faster.
ubatch-size = 1024
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat
temp = 1.0
top-k = 64
top-p = 0.95
