upstream openwebui {
    server 192.168.20.25:3000;
    keepalive 128;
    keepalive_timeout 1800s;
    keepalive_requests 10000;
}

server {
    server_name gptr.agx.fi;
    include /etc/nginx/conf.d/servers/agx-ai-settings.conf;

    location / {
        proxy_pass http://192.168.20.25:8000;
    }
}

server {
    server_name gptr-nextjs.agx.fi;
    include /etc/nginx/conf.d/servers/agx-ai-settings.conf;

    location / {
        proxy_pass http://192.168.20.25:3001;
    }
}

server {
    server_name litellm.agx.fi;
    include /etc/nginx/conf.d/servers/agx-ai-settings.conf;

    location / {
        proxy_pass http://192.168.20.25:4000;
    }
}

server {
    server_name owui.agx.fi;
    include /etc/nginx/conf.d/servers/agx-ai-settings.conf;

    # LLM API
    location /api/ {
        include /etc/nginx/conf.d/servers/agx-ai-api.conf;
        proxy_pass http://openwebui;
    }

    # WebSocket endpoints
    location ~ ^/(ws/|socket\.io/) {
        include /etc/nginx/conf.d/servers/agx-ai-websocket.conf;
        proxy_pass http://openwebui;
    }

    # Static assets - CAN buffer and cache
    location /static/ {
        include /etc/nginx/conf.d/servers/agx-ai-static.conf;
        proxy_pass http://openwebui;
    }

    # Default location
    location / {
        proxy_pass http://openwebui;
    }
}
