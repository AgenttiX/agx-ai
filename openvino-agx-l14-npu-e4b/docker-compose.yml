# Gemma 4 E4B on the NPU of the ThinkPad L14 Gen 5 with a third-party server. See README.md for the setup and notes.
services:
  gemma4-npu:
    image: ghcr.io/agenttix/agx-ai/gemma4-npu:latest
    container_name: gemma4-npu
    devices:
      - /dev/accel:/dev/accel
    environment:
      # The model files of the reviewed commit are downloaded at startup to the Hugging Face cache of the host.
      # Only the hub directory is mounted, so that e.g. a token in ~/.cache/huggingface is not visible.
      HF_HUB_CACHE: /hf-hub
    # /dev/accel/accel0 belongs to the host's render group, whose name does not exist in the image (getent group render).
    group_add:
      - "992"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9934:8000"
    # Run as the host user, so that the files in the Hugging Face cache are not owned by root.
    user: "1000:1000"
    volumes:
      - /home/mika/.cache/huggingface/hub:/hf-hub
      - npu-cache:/npu-cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the model files (~15.5 GB) and compiles the model for the NPU.
      start_period: 3600s

volumes:
  # The NPU compilation cache (9 GB). It depends on the NPU driver and OpenVINO versions in the image.
  npu-cache:
