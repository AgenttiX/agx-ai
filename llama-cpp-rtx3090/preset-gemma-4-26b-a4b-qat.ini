version = 1

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; The KV cache stays at f16: a q8_0 cache saves only ~7 % of the memory per token here (the CUDA flash attention
; needs f16 conversion buffers that grow with the context), is slower (tg128 at depth 16384: 122 vs 142 t/s) and
; changes the output slightly more than the noise. q4_0 would save ~30 %, but it is clearly lossy. See README.md.
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21532 MiB in the benchmarks).
ctx-size = 165888
; With no-mmproj-offload = 1 (vision encoder on the CPU), the maximum is 212992.
; ctx-size = 212992
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
; Off is 14-22 % slower in prompt processing and 33 % slower in generation at depth 16384.
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; no-mmproj-offload = 1
parallel = 2
; Fastest of 1-3 (see README.md).
spec-draft-n-max = 2
spec-type = draft-mtp
; Speeds up prompt processing by 22-34 % compared to the default 512 (1024: +14-22 %) for ~870 MiB
; (~40k tokens of context).
ubatch-size = 2048
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

; Benchmarks: README.md
