version = 1

[Teriminal-RSI/Terminal-RSI-27B]
; bartowski's imatrix Q4_K_M (16.2 GiB, with the MTP layer). IQ4_XS (14.4 GiB) is 4-12 % faster and fits ~40k more
; tokens, but its answer distributions differ from Q4_K_M's by 14 times the noise floor (mean KLD 0.0078 vs 0.00054,
; first token 0.036 vs 0.0027, 8 vs 3 changed top tokens) with the same retrieval accuracy (166/176). See README.md.
hf = bartowski/Teriminal-RSI_Terminal-RSI-27B-GGUF:Q4_K_M
; q8_0 K and V caches are within the noise in quality for this architecture; see preset-qwen3.8-27b.ini and README.md.
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21518 MiB with a 96804-token prompt).
; With spec-draft-n-max = 2: 104448 (peak 21480 MiB); with the vision encoder on the GPU and 2 drafts: ~77824.
ctx-size = 98304
fit = off
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; The vision encoder (1.1 GiB) on the CPU: +~26k tokens of context for a terminal agent that rarely sends images.
; A 1280x960 image takes 6.4 s instead of 1.7 s.
no-mmproj-offload = 1
parallel = 1
; 4 drafts: chat 63-65 t/s, 73 / 70 / 61 / 57 t/s at 6.4k / 16k / 36.5k / 60k, edits 85-88 / 76-78 t/s;
; 3: 61 t/s, 71 / 68 / 59 / 48, edits 78-81 / 67-68; 2: 61 t/s, 68 / 61 / 52 / 45, edits 67 / 58. 4 costs ~150 MiB
; (6k tokens of context) more than 2. The base Qwen3.8-27B is fastest with 2; this finetune accepts longer drafts.
spec-draft-n-max = 4
spec-type = draft-mtp
; 1024 and 2048 speed up prompt processing by only 3-5 % for this architecture (preset-qwen3.8-27b.ini).
ubatch-size = 512
; Model parameters: the evaluation settings of the model card (temperature 0.6, top-p 0.95; the checkpoint's
; generation_config.json has 1.0) with Qwen3.8's top-k 20 and min-p 0.
min-p = 0.0
temp = 0.6
top-k = 20
top-p = 0.95

; Benchmarks: README.md
