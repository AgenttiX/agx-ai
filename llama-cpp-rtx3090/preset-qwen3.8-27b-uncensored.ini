version = 1

[HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF]
hf = HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF:IQ4_XS
; q8_0 K and V caches are within the noise in quality; see preset-qwen3.8-27b.ini and README.md.
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21542 MiB in the benchmarks).
ctx-size = 118784
; With no-mmproj-offload = 1 (vision encoder on the CPU), the maximum is 145408.
; ctx-size = 145408
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
flash-attn = on
; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
; image-min-tokens = 1024
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; no-mmproj-offload = 1
; init: chat template supports preserving reasoning, consider enabling it via --reasoning-preserve
; reasoning-preserve = true
parallel = 1
; Fastest of 1-3 (see README.md).
spec-draft-n-max = 2
spec-type = draft-mtp
; 1024 and 2048 speed up prompt processing by only 3-5 %.
ubatch-size = 512
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95
