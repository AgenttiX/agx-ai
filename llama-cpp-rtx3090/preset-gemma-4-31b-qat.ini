version = 1

[google/gemma-4-31b-qat]
hf = unsloth/gemma-4-31B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; q8_0 KV cache lets all 60 layers fit on the RTX 3090 at this context size, which doubles the generation speed.
; It changes the output no more than a different ubatch size does (within the noise); q4_0 is clearly lossy
; (see README.md).
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21520 MiB in the benchmarks).
ctx-size = 61440
; With the vision encoder on the GPU (without no-mmproj-offload), the maximum is 38912.
; ctx-size = 38912
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on"). Off is 20-50 % slower.
flash-attn = on
; load-mode = dio
load-mode = none
load-on-startup = true
; Total layers = 60
n-gpu-layers = all
; With the f16 KV cache, only 53 layers fit
; n-gpu-layers = 53
; The vision encoder on the CPU frees ~1.3 GiB (~22k tokens of context).
no-mmproj-offload = 1
parallel = 1
; Fastest of 1-5 (see README.md).
spec-draft-n-max = 4
spec-type = draft-mtp
; 1024 speeds up prompt processing by 3-5 % vs the default 512 for +480 MiB (~8k tokens of context).
; 2048 is +4-7 % vs 512 for +1500 MiB.
ubatch-size = 512

; Benchmarks: README.md
