version = 1

[Qwen/Qwen3.8-Flash-Next]
; IST Austria's mixed-precision quantization (GSQ-RCO), 3.5 bits per weight on average over the transformer weights:
; 54.8 GB of weights and the 28.8 GB n-gram embedding table (IQ4_NL). It matches or exceeds the BF16 model on
; AIME25, GPQA-Diamond and LiveCodeBench v6 according to the model card. Unsloth's UD-Q4_K_XL (111 GB) would not fit
; in the RAM next to the desktop.
hf = ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF:IQ3_S
; Only the 12 attention layers have a KV cache (~29 KiB per token with q8_0), so the full trained context fits.
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 262144
fit = off
flash-attn = on
; Hybrid CPU+GPU inference with mmap would result in this warning:
; llama_model_loader: tensor overrides to CPU are used with mmap enabled - consider using --load-mode none for better performance
; The weights in RAM (~37 GB of experts and the 28.8 GB n-gram table) then take ~66 GB of anonymous memory.
load-mode = none
load-on-startup = true
; All layers are on the GPU, except for the experts of 42 of the 48 layers, which are in RAM and computed by the CPU.
; Generation is bound by the memory bandwidth of the CPU: with 37 layers of experts on the CPU (and 131072 tokens of
; context), it is only 7 % faster. See README.md.
n-cpu-moe = 42
n-gpu-layers = all
parallel = 1
; As fast as 32 threads, as generation is bound by the memory bandwidth.
threads = 24
; 4096 does not fit.
ubatch-size = 2048
batch-size = 2048
; MTP for this model is not in llama.cpp yet (https://github.com/ggml-org/llama.cpp/pull/27836).
; Model parameters (thinking mode)
; https://huggingface.co/Qwen/Qwen3.8-Flash-Next#best-practices
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95
