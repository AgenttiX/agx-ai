version = 1

[HauhauCS/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP]
hf = HauhauCS/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP:Q4_K_M
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; q8_0 KV cache lets all layers fit on the RTX 3090, which doubles the generation speed.
; It changes the output no more than a different ubatch size does (within the noise); q4_0 is clearly lossy
; (see README.md).
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21526 MiB in the benchmarks).
; This GGUF (Q4_K_M, 17.4 GiB) is 1.3 GiB larger than unsloth's UD-Q4_K_XL of preset-gemma-4-31b-qat.ini.
ctx-size = 38912
; With the vision encoder on the GPU (without no-mmproj-offload), the maximum is 16384.
; ctx-size = 16384
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
flash-attn = on
; load-mode = dio
load-mode = none
load-on-startup = true
n-gpu-layers = all
; With the f16 KV cache and ctx-size 50000
; n-gpu-layers = 50
; The vision encoder on the CPU frees ~1.3 GiB (~22k tokens of context).
no-mmproj-offload = 1
parallel = 1
; 3 and 4 are within 1 % of each other and 1-2 % faster than 2 (see README.md).
spec-draft-n-max = 3
spec-type = draft-mtp
; 1024 speeds up prompt processing by 3-5 % vs the default 512 for +480 MiB (~8k tokens of context).
ubatch-size = 512

; Benchmarks: README.md
