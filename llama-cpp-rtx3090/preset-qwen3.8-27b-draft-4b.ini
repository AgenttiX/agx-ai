version = 1

; Qwen3.8-27B with NVIDIA's external draft model Qwen3.5-4B-Qwen3.8-27B-Draft instead of the MTP head. Experimental:
; slower than preset-qwen3.8-27b.ini (MTP) in everything but long code edits, with 40 % of its context.
; Needs docker-compose-draft.yml (llama.cpp b12627 with ../llama-cpp-draft/draft-rollback.patch, without which the
; draft is 2.5 times slower). See README.md (External draft model).
[Qwen/Qwen3.8-27B]
hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
; bartowski's IQ4_XS (2.4 GB): the fastest draft. Q8_0 (4.5 GB) is accepted a little more often (44 vs 41 %) but
; drafts slower and costs 1.9 GiB of context. Download first:
; hf download bartowski/Qwen3.5-4B-Qwen3.8-27B-Draft-GGUF Qwen3.5-4B-Qwen3.8-27B-Draft-IQ4_XS.gguf
; The path is pinned to a snapshot, as there is no --hf-file equivalent for the draft model. bartowski's GGUFs have the
; fused tensors (attn_qkv_gate, ssm_beta_alpha) that need b12627 or newer.
model-draft = /root/.cache/huggingface/hub/models--bartowski--Qwen3.5-4B-Qwen3.8-27B-Draft-GGUF/snapshots/6e5f6f8589400c89a564612da0464c3ad8cf5110/Qwen3.5-4B-Qwen3.8-27B-Draft-IQ4_XS.gguf
spec-type = draft-simple
; Chat 35.7 t/s with 6, 34.1 with 4, 33.6 with 3, 31.9 with 2; code edits 67 t/s with 6 and 81 with 10 (but chat
; 30 t/s and only ~32k tokens of context). MTP: chat 59, edits 76 t/s.
spec-draft-n-max = 6
; The draft was trained for drafting by sampling under the target's sampling settings and rejection sampling.
; Greedy drafting was as fast before the patch (21.4 vs 20.4 t/s in chat).
spec-draft-sampling = probabilistic
; The draft's 8 attention layers have their own KV cache (17 KiB per token in q8_0, 32 KiB in f16).
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21452 MiB with a 39460-token prompt). The draft
; (2.3 GiB), its KV cache and the recurrent-state snapshots of both models for 6 drafted tokens take ~60k tokens of
; context compared with MTP.
ctx-size = 40960
fit = off
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; The vision encoder on the CPU, so that it does not cost ~30k more tokens of context. The draft model gets zeros for
; image tokens, so drafts after images are poor.
no-mmproj-offload = 1
parallel = 1
ubatch-size = 512
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95
