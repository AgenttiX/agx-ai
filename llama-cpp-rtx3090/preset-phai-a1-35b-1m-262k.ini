version = 1

[PhaiModelLab/Phai-A1-35B-1M]
; Phai-A1-35B-1M with 262144 tokens of context: the same GGUF and settings as preset-phai-a1-35b-1m.ini (151552
; tokens, all on the GPU), but with the experts of 6 of the 40 layers in RAM and computed by the CPU. See README.md.
model = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/Phai-A1-35B-1M-MTP-IQ4_XS.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/mmproj-F16.gguf
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 21272 MiB of llama-server with a 260644-token prompt.
ctx-size = 262144
fit = off
flash-attn = on
; The experts in RAM need anonymous memory instead of mmap (as for preset-qwen3.8-flash-next.ini): with mmap, prompt
; processing at ubatch 1024 was 21 % slower (llama bench).
load-mode = none
load-on-startup = true
; Each layer of experts in RAM frees ~400 MiB of VRAM (~19k tokens of q8_0 context) and costs ~0.3 ms per token in
; generation; prompt processing copies the experts in RAM to the GPU for every ubatch. 6 layers with ubatch 1024
; generate 8-11 % faster than 9 layers with ubatch 2048, which process prompts 14-18 % faster. See README.md.
n-cpu-moe = 6
n-gpu-layers = all
; The vision encoder on the CPU.
no-mmproj-offload = 1
parallel = 1
; 3 drafts: chats as fast as 1-2, code edits 10-30 % faster. Without MTP, generation at 36.5k tokens is 19 % slower.
spec-draft-n-max = 3
spec-type = draft-mtp
; For the experts on the CPU: 16 threads are 10 % faster than the default (32) and 4 % faster than 8 or 12.
threads = 16
ubatch-size = 1024
; Model parameters: generation_config.json of the model (as for Qwen3.6)
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

; Benchmarks: README.md
