version = 1

[thinkingmachines/Inkling-2-Mini]
; Inkling 2 Mini (Thinking Machines, 2026-11-20): a 26B MoE (128 experts, 8 active) whose middle 12 of its 24 layers
; run three times per token with shared weights, with a DSpark block drafter. Needs docker-compose-inkling.yml (its
; image has the drafter of the open llama.cpp pull request #32218). See README.md.
; Unsloth's UD-Q4_K_XL (16.4 GiB), the file of Mainline_Support/ for upstream llama.cpp.
model = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/Inkling-2-Mini-UD-Q4_K_XL.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/mmproj-BF16.gguf
; Unsloth's DSpark drafter (dspark-Inkling-2-Mini-Q8_0.gguf, 0.4 GB) on the GPU, ~1 GiB with its buffers (~33k tokens
; of context). 3 drafts: chats 12 %, generation at 36.5k tokens of context 18 % and code edits 71 % faster than without
; it. 5 and 7 drafts edit 11 % faster than 3, but chat 20-30 % slower.
model-draft = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/dspark-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 3
; Each pass through the loop has its own KV cache: the 4 global-attention layers (2 of them in the loop) store 8
; layers of KV, 17 KiB per token with q8_0.
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 21360 MiB of llama-server with a 117284-token prompt.
ctx-size = 118784
fit = off
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; The vision encoder on the CPU (0.6 GiB on the GPU); an image of 1280x960 takes ~4 s.
no-mmproj-offload = 1
parallel = 1
; The relative-position bias of the global-attention layers is a [heads x context x ubatch] F32 tensor (~210 bytes per
; token of context and of the ubatch): 1.7 GiB at 131072 tokens with ubatch 64, 25 GiB with the default 1024. Prompt
; processing at 15k tokens: 493 t/s with 64, 572 with 128, 696 with 256, 759 with 512, which would fit ~98k, ~61k
; and ~35k tokens of context.
ubatch-size = 64
; Model parameters: generation_config.json of the model.
min-p = 0.0
temp = 1.0
top-k = 0
top-p = 1.0

; Benchmarks: README.md
