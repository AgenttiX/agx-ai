version = 1

[PhaiModelLab/Phai-A1-35B-1M]
; A coding and agent fine-tune of Qwen3.6-35B-A3B (MoE, 3B active parameters) with a 1M-token context (YaRN factor 4,
; enabled by the config). The published checkpoint has no MTP weights, so this GGUF is built locally with the MTP head
; of Qwen3.6-35B-A3B grafted on (../vllm/graft_mtp.py) and mradermacher's imatrix (IQ4_XS, 17.85 GiB). See README.md.
model = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/Phai-A1-35B-1M-MTP-IQ4_XS.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/mmproj-F16.gguf
; Only the 10 full-attention layers (and the MTP layer) have a KV cache. q8_0 costs 21 MiB per 1024 tokens of context
; with the f16 conversion buffers, f16 ~30 MiB. f16 would be 12 % faster in generation at 16k and 32 % at 65k tokens of
; context (llama bench), but fits only ~80k tokens. q8_0 is slightly above the noise floor in the retrieval test (mean
; KLD 0.0062 vs 0.0036 for another ubatch size) with the same accuracy. See README.md.
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21612 MiB with a 150052-token prompt).
ctx-size = 151552
; With the vision encoder on the GPU (1108 MiB), the maximum is ~99000.
; ctx-size = 99328
fit = off
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; The vision encoder on the CPU frees 1108 MiB (~52k tokens of context); an image of 1280x960 takes ~5.5 s.
no-mmproj-offload = 1
parallel = 1
; The grafted MTP head is accepted 50-65 % of the time in chats and at depth, 99 % in code edits. 2 and 3 drafts are as
; fast in chats and at 36.5k-100k tokens of context; 3 is 8-10 % faster in edits (263 vs 244 t/s). 4 is slower.
; Without MTP, chats are 14 % and generation at 36.5k tokens of context 27 % slower.
spec-draft-n-max = 3
spec-type = draft-mtp
; pp2048 vs 512: +22 % (1024) and +37 % (2048) at depth 0, +19 % / +31 % at 16k. 2048 costs ~600 MiB more than 1024
; (~30k tokens of context, 2048: max ~113k), 512 saves ~300 MiB (~181k). 1024 is the compromise.
ubatch-size = 1024
; Model parameters: generation_config.json of the model (as for Qwen3.6)
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

; Benchmarks: README.md
