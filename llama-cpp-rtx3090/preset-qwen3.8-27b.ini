version = 1

[Qwen/Qwen3.8-27B]
; Unsloth Dynamic 3.1 (uploaded 2026-11-11, 16.6 GB): as fast as the earlier Dynamic 3.0 file and the same retrieval
; accuracy, but 96 MiB more VRAM at the same context. See README.md.
hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
; q8_0 K and V caches change the output no more than a different ubatch size does (within the noise) and allow a
; ~60 % larger context, but generation at 36-60k tokens of context is 9-15 % slower than with f16 (chat: 1-3 %).
; q4_0 is no faster and clearly above the noise. See README.md.
cache-type-k = q8_0
cache-type-v = q8_0
; The largest context that keeps llama-server at ~21 GiB of VRAM (peak 21660 MiB with the Dynamic 3.1 file, build
; b12242 and the full benchmark; the Dynamic 3.0 file peaked at 21652 MiB with 102400).
; With f16 caches, the maximum would be ~62000.
ctx-size = 100352
; With no-mmproj-offload = 1 (vision encoder on the CPU), the maximum is ~127000.
; ctx-size = 126976
fit = off
; The default "auto" already enables flash attention on CUDA (same speed as "on").
; Off is 20 % slower in prompt processing and 30 % slower in generation at depth 16384.
flash-attn = on
; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
; image-min-tokens = 1024
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; no-mmproj-offload = 1
; init: chat template supports preserving reasoning, consider enabling it via --reasoning-preserve
; reasoning-preserve = true
parallel = 1
; Fastest of 1-3 (see README.md).
spec-draft-n-max = 2
spec-type = draft-mtp
; 1024 and 2048 speed up prompt processing by only 3-5 % for +280/+770 MiB (6k/17k tokens of context).
ubatch-size = 512
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

; Benchmarks: README.md
