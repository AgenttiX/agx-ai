# DiffusionGemma 26B-A4B (block diffusion) with llama.cpp on the RTX 3090, on the same port as docker-compose.yml
# (9931): only one of them fits on the GPU at a time. DiffusionGemma is not in upstream llama.cpp yet, so this runs the
# llama-diffusion-gemma-server of a draft pull request, see ../llama-cpp-diffusion-gemma/README.md.
# docker compose stop (here), then: docker compose -f docker-compose-diffusiongemma.yml up -d
# Benchmarks: README.md (DiffusionGemma). vLLM is 2.4 times as fast for this model on this GPU and fits 6 times the
# context: ../vllm-rtx3090/config-diffusiongemma-26b-a4b.yaml.
services:
  llama-cpp-diffusiongemma:
    # Built by ../.github/workflows/deploy-docker-llama-cpp-diffusion-gemma.yml.
    # Locally: docker build -t <the image> ../llama-cpp-diffusion-gemma
    image: ghcr.io/agenttix/agx-ai/llama-cpp-diffusion-gemma:latest
    container_name: llama-cpp-diffusiongemma
    # The API key of the llama.cpp servers (LLAMA_API_KEY in ../llama-cpp/llama-cpp.env).
    entrypoint: ["/bin/sh", "-c", "exec /app/llama-diffusion-gemma-server --api-key \"$$LLAMA_API_KEY\" \"$$@\"", "--"]
    command: [
      "--model", "/root/.cache/huggingface/hub/models--unsloth--diffusiongemma-26B-A4B-it-GGUF/snapshots/f4183a2c7a354128d02545752303c4354d165bf0/diffusiongemma-26B-A4B-it-Q4_K_M.gguf",
      "--host", "0.0.0.0",
      "--port", "9931",
      "--n-gpu-layers", "99",
      # The KV cache is full-size in all layers (also the sliding-window ones), as the canvas attends bidirectionally.
      # q8_0 halves it (16384 instead of 8192 tokens fit) and makes each denoising step ~8 % slower than f16.
      "--ctx-size", "16384",
      "--cache-type-k", "q8_0",
      "--cache-type-v", "q8_0",
      "--flash-attn", "on",
      "--metrics",
      "--slots",
    ]
    env_file:
      - ../llama-cpp/llama-cpp.env
    ports:
      - "9931:9931"
    volumes:
      # Download first: hf download unsloth/diffusiongemma-26B-A4B-it-GGUF --include "*Q4_K_M*"
      - /home/mika/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              count: all
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9931/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
