# llama.cpp router server for the ThinkPad L14 Gen 5 (Intel Core Ultra 5 125U, Intel Graphics iGPU, 32 GB RAM).
# Models and their settings are in preset.ini, server-wide settings in config.ini,
# and the benchmark notes (CPU vs. iGPU vs. NPU) in README.md.
# OpenVINO Model Server runs other models on the iGPU or the NPU (../openvino-l14*). Do not run its LLM servers at the
# same time as this one: together they exhausted the 32 GB of RAM and the kernel killed the desktop session.
services:
  llama-cpp:
    # The Vulkan image contains both the Vulkan (iGPU) and the CPU backends.
    # Pinned to build b12723 (2026-11-25), as there are no build-tagged Vulkan images after b12282.
    image: ghcr.io/ggml-org/llama.cpp@sha256:4e88890069ad09665bf3b8f430f49b308198b5326329693022fef8abc25d2930
    container_name: llama-cpp
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - path: ../llama-cpp/llama-cpp.env
        # required: false
    environment:
      # The image sets LLAMA_ARG_PORT=8080, which would override the port of config.ini.
      LLAMA_ARG_PORT: "9931"
    # The group names do not exist in the image, so use the host's GIDs (getent group video render).
    group_add:
      - "44"
      - "992"
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - /home/mika/.cache/huggingface/hub:/root/.cache/huggingface/hub
      - ../llama-cpp/config.ini:/etc/llama.cpp/config.ini:ro
      - ./preset.ini:/etc/llama.cpp/preset.ini:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9931/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
