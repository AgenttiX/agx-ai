; OpenVINO Model Server generates this model over twice as fast on the iGPU (../openvino-l14), see README.md.
[qwen/qwen3.5-9b]
; UD-Q4_K_XL: Q4_0 processes prompts ~30 % faster (105 vs 81 t/s), but generates no faster and accepts fewer drafts.
hf = unsloth/Qwen3.5-9B-MTP-GGUF:UD-Q4_K_XL
ctx-size = 50000
; The context checkpoints are kept (unlike for Gemma 4): without them, the recurrent layers make every follow-up turn
; reprocess the whole conversation (63 s vs 3 s for a 5k-token chat), see README.md.
device = Vulkan0
fit = off
; Flash attention is slow on this iGPU and caused GPU hangs, see README.md.
flash-attn = off
; The BF16 vision encoder (picked by hf) on the iGPU: an image takes 38 s, 100 s on the CPU (no-mmproj-offload).
; The F16 one took 252 s and broke the text answers of the server afterwards.
n-gpu-layers = all
parallel = 1
; MTP 2: chat 5.7 t/s vs 4.6 without, MTP 1 5.6, MTP 3 4.9; the greedy answers stayed correct.
spec-draft-n-max = 2
spec-type = draft-mtp
; Model parameters (thinking mode, general tasks)
; https://huggingface.co/Qwen/Qwen3.5-9B#best-practices
min-p = 0.0
presence-penalty = 1.5
temp = 1.0
top-k = 20
top-p = 0.95

; Qwen3-4B on the NPU through the OpenVINO image (server-openvino, GGML_OPENVINO_DEVICE=NPU), as a demonstration:
; the CPU runs it 8x faster (see README.md). Replaced by ../openvino-l14.
;[qwen/qwen3-4b-npu]
;hf = Qwen/Qwen3-4B-GGUF:Q4_K_M
;; The NPU is usable only with a tiny context: ctx 1024 is 3x slower than 512.
;ctx-size = 512
;device = OPENVINO0
;; The NPU does not support parallel sequences.
;parallel = 1
;; Model parameters
;; https://huggingface.co/Qwen/Qwen3-4B-GGUF#best-practices
;min-p = 0.0
;temp = 0.6
;top-k = 20
;top-p = 0.95
