version = 1

; Configuration for the Steam Frame (agx-frame). See README.md for the benchmarks and the reasoning behind the settings.
; All models run on the Adreno 750 GPU with Vulkan. The CPU generates faster with a short context, but it processes
; prompts at half the speed, falls behind with a longer context, heats up to 95 °C and competes with the VR runtime.
; For the CPU instead: device = none, n-gpu-layers = 0, threads = 4, threads-batch = 8.
; Only one model is loaded at a time (models-max = 1 in config.ini).

[google/gemma-4-e4b-qat]
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 32768
device = Vulkan0
fit = off
; Flash attention makes no difference on this GPU.
flash-attn = on
load-on-startup = true
n-gpu-layers = all
parallel = 1
; MTP with the Unsloth drafter (mtp-gemma-4-E4B-it.gguf, 57 MB), see README.md.
spec-type = draft-mtp
spec-draft-n-max = 2
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-e2b-qat]
hf = unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 32768
device = Vulkan0
fit = off
flash-attn = on
n-gpu-layers = all
parallel = 1
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-12b-qat]
hf = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
; The model takes 6.2 GiB of the ~10 GiB of free memory.
ctx-size = 16384
device = Vulkan0
fit = off
flash-attn = on
n-gpu-layers = all
parallel = 1
; The default 512 made the GPU hang (vk::DeviceLostError, a6xx_recover in the kernel log), see README.md.
ubatch-size = 128
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[qwen/qwen3.5-9b]
hf = unsloth/Qwen3.5-9B-GGUF:Q4_0
ctx-size = 16384
device = Vulkan0
fit = off
flash-attn = on
n-gpu-layers = all
parallel = 1
; Model parameters
; https://unsloth.ai/docs/models/qwen3.5
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95
