# Qwen3.8-Flash-Next with vLLM on one RTX 3090 (agx-z2e), with its experts in RAM and computed partly on the CPU, and
# images and videos through the vision tower on the CPU. A share of the cold experts is computed by the Radeon VII
# (the rvii-experts service, rvii_experts/README.md), which needs the whole Radeon VII: stop llama-cpp-radeon-vii first.
# The image is built from this directory, see README.md; the configuration and the measurements behind it are in
# ../vllm-rtx3090/README.md#qwen38-flash-next and README.md (Radeon VII experts).
# The same port as ../vllm-rtx3090 and ../llama-cpp-rtx3090 (9931): only one of them fits on the GPU at a time.
# The API key is the one of the llama.cpp servers (LLAMA_API_KEY in ../llama-cpp/llama-cpp.env).
# Start: docker compose -f ../vllm-rtx3090/docker-compose.yml stop && docker compose -f ../llama-cpp-radeon-vii/docker-compose.yml stop
#        && docker compose up -d

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]
            count: all

services:
  vllm-flash-next:
    <<: *gpu
    # The single-RTX-3090 runtime of https://github.com/DominikBucko/qwen38-flash-next-3090 (a vLLM build with
    # CPU expert kernels for Qwen3.8-Flash-Next) with image and video input, the vision tower on the CPU: the image of
    # this directory, built by ../.github/workflows/deploy-docker-vllm-rtx3090-flash-next.yml. See README.md.
    image: ghcr.io/agenttix/agx-ai/vllm-flash-next:latest
    container_name: vllm-flash-next
    # The runtime takes the API key from VLLM_API_KEY. The checkpoint: albucino/Qwen3.8-Flash-Next-W4A16-FP8PLE with
    # its Gated DeltaNet and attention projections in int8 (README.md: a view of the checkpoint in
    # ~/.cache/vllm-models with one new 2.6 GB shard and links to the original shards), and the checkpoint's own MTP
    # drafter (its runtime/ directory, which the view does not have).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        VLLM_API_KEY="$$LLAMA_API_KEY" exec /usr/local/bin/qwen38-serve
        /models/Qwen3.8-Flash-Next-W4A16-FP8PLE-dense8-view
        /root/.cache/huggingface/hub/models--albucino--Qwen3.8-Flash-Next-W4A16-FP8PLE/snapshots/ef554143369a706525336f6b42a09094835dc077/runtime/mtp-int4-g32
    env_file:
      - ../llama-cpp/llama-cpp.env
    # Overrides of the runtime's defaults (configs/3090-64gb-128k.env of the runtime repository, see its
    # docs/tuning.md). Benchmarks on agx-z2e: ../vllm-rtx3090/README.md#qwen38-flash-next
    environment:
      SERVED_MODEL_NAME: Qwen/Qwen3.8-Flash-Next
      PORT: "8000"
      # The full trained context of 262144 tokens (the runtime's default: 135168), like llama.cpp. It fits because the
      # token embedding is in pinned RAM (QWEN38_EMBED_UVA, -1.18 GiB, looked up over PCIe) and fewer experts stay on
      # the GPU (see ../vllm-rtx3090/README.md). The KV cache holds 287594 tokens; the runtime needs ~1.05 times the
      # context. Peak 20238 MiB with a 260000-token prompt.
      MAX_MODEL_LEN: "262144"
      KV_CACHE_MEMORY_BYTES: "5150000000"
      # Uncensored mode: removes the model's refusal direction at runtime, as orcarouter/Qwen3.8-Flash-Next-Uncensored
      # (abliteration.py, from the 2x RTX 3090 runtime; README.md, Abliteration). This removes the model's safety
      # refusals; remove the line (or set it to "0") for the original behaviour. Speed unchanged.
      # https://github.com/DominikBucko/qwen38-flash-next-2x3090/blob/main/docs/abliteration.md
      QWEN38_ABLITERATION: "orcarouter"
      QWEN38_EMBED_UVA: "1"
      # The lm_head in int8 with one scale per row and 128 inputs (flash-next.patch), converted after loading: it and
      # MTP's reduced draft head (a view of it) read half as much in every decode step, -1.3 ms per step, and 0.6 GiB
      # less VRAM. The retrieval test's KL divergence is at the noise floor (README.md, CPU kernel and prefetch).
      QWEN38_INT8_SKINNY: "1"
      # Experts per layer kept on the GPU (~116 MiB of weights each, ~200 MiB of peak VRAM with the prefill buffers;
      # default 32, which needs 23.4 GB). The other ones are computed by the CPU during decode (and partly by the GPU
      # over PCIe) and streamed to the GPU during prefill. The int8 dense layers leave room for 24 instead of 14:
      # 4 % fewer cold experts per decode step for the CPU.
      QWEN38_HOT_ONLY: "24"
      # No share of the cold experts for the RTX 3090 (over PCIe): its share (0.3 before) would take the first cold
      # experts of each layer, including those of the Radeon VII, and with the Radeon VII, 0 is 23-35 % faster
      # (README.md). Without the Radeon VII, 0.15-0.45 made no difference.
      QWEN38_GPU_SHARE_FRAC: "0"
      # Cold experts on the Radeon VII (rvii-moe.patch): the experts that the rvii-experts service holds are sent to it
      # over /dev/shm (ipc: host) and computed there while the CPU computes the others. If the service is not running
      # or does not answer, the CPU computes them.
      QWEN38_RVII: "1"
      # The CPU experts with int8 activations (cpu-moe.patch, README.md): ~2.3 times as fast per thread as the
      # runtime's FP32 activations, so that 8 threads, 1 on each 4-core CCX of the Threadripper 3970X, reach the
      # memory bandwidth (the runtime's default: 24 threads), and the other cores are left to the serving processes
      # that drive the GPU. No measurable quality loss (../vllm-rtx3090/README.md#cpu-expert-kernel-2026-10-26).
      # QWEN38_CPU_EXPERTS_INT16=1 instead is practically exact and needs 16 threads (1-2,5-6,...,29-30).
      QWEN38_CPU_EXPERTS_INT8: "1"
      QWEN38_CPU_EXPERTS_CPUS: "1,5,9,13,17,21,25,29"
      # While the GPU computes between two layers (~0.2 ms), the idle pool threads load the experts of the next layer
      # that the CPU computed in the previous step (1 per thread, most tokens first) into their L3 cache, and then
      # compute those experts first (cpu-moe-opt.patch): ~45 % of them are used again, 9 % less CPU time per step
      # (README.md, CPU kernel and prefetch). 2 per thread were not faster.
      QWEN38_CPU_EXPERTS_PREFETCH: "1"
      # The experts to prefetch predicted by the next layer's router from this layer's MoE input ("pre-gating",
      # computed by the RTX 3090 while it waits for the CPU, cpu-moe-opt.patch): ~61 % of the prefetched experts are
      # used instead of ~42 %, -3.5 % CPU time per step, +2.4 % in code edits (README.md, Pre-gating prefetch).
      QWEN38_CPU_EXPERTS_PREGATE: "1"
      # A loader thread on another core of each pool thread's CCX (core 2 of 0-3): it reads the expert that its pool
      # thread is computing with plain loads, ahead of it, into the CCX's L3 (cpu-moe-opt.patch): -5 % CPU time per
      # step, +2.5 % in code edits, +4-6 % with code context (README.md, CPU kernel and prefetch). On the SMT siblings
      # of the pool's cores (which the runtime keeps idle) only -1 %.
      QWEN38_CPU_EXPERTS_LOADER_CPUS: "2,6,10,14,18,22,26,30"
      # The serving processes on cores 0 and 3 of each CCX and their SMT siblings, i.e. without the pool's and the
      # loaders' cores (the runtime's default: all CPUs except the SMT siblings of the pool's cores).
      QWEN38_MAIN_CPUS: "0,3-4,7-8,11-12,15-16,19-20,23-24,27-28,31-32,35-36,39-40,43-44,47-48,51-52,55-56,59-60,63"
      # The pool's and the loaders' threads with the real-time policy SCHED_FIFO (priority 10) while they compute
      # (cpu-moe-opt.patch; needs cap_add SYS_NICE below), and all other threads of the serving processes off their
      # CPUs: other programs on the pool's cores give way to it. The threads sleep between requests, so the cores are
      # free for other programs then. With 64 busy threads of other programs: 46 instead of 20 t/s in chats, 63-65
      # instead of 27 in code edits; without other programs the same as before (README.md, CPU isolation).
      QWEN38_CPU_EXPERTS_FIFO: "10"
      # The Radeon VII answers within ~16 us after the CPU has computed its own experts (99th percentile): if it has
      # not answered 2 ms after that (default 20 ms), the CPU computes its experts for that layer.
      QWEN38_RVII_TIMEOUT_US: "2000"
      # In prefill chunks (more than 384 tokens), the Radeon VII computes the 112 least used of its experts of each
      # layer, and the RTX 3090 streams only the other cold experts from RAM (rvii_prefill.py): +12.5 % prompt
      # processing at 32k tokens (README.md, Radeon VII in prefill). 96 and 135 were slower (the Radeon VII and the
      # RTX 3090 are balanced at ~112).
      QWEN38_RVII_PREFILL: "112"
      # The decode requests of each expert, for the Radeon VII worker's automatic re-ranking (rvii_experts/rerank.py,
      # in the rvii-experts service below), and its ranking for the hot experts of the next start, once it exists.
      QWEN38_EXPERT_USAGE: /dev/shm/qwen38-usage.bin
      QWEN38_RANKINGS_AUTO: /models/flash-next-rvii-measured/hot24-n135-auto/rankings.json
      # Log CPU and GPU decode step times every N steps (0 = off).
      QWEN38_CPU_EXPERTS_STATS: "0"
      # Image and video input with the vision tower on the CPU (README.md): 32 threads were the
      # fastest (6.5 s for a 1280x960 image without scaling, vs 9.7 s with 16 and 9.2 s with 64). The defaults of
      # the image: images scaled to 1 megapixel (QWEN38_VISION_MAX_PIXELS), up to 4 per request; 1 video per
      # request (QWEN38_VISION_MAX_VIDEOS), sampled at 2 frames per second, at most 64 frames
      # (QWEN38_VISION_VIDEO_MAX_FRAMES) with 12 megapixels over all frames (QWEN38_VISION_VIDEO_MAX_PIXELS).
      # QWEN38_VISION=0 serves text only.
      QWEN38_VISION_THREADS: "32"
    ipc: host
    cap_add:
      - SYS_PTRACE
      # For QWEN38_CPU_EXPERTS_FIFO
      - SYS_NICE
    ulimits:
      memlock: -1
      stack: 67108864
    # The runtime sizes its RAM arena for the cold experts from this limit (limit - 10 GiB, at most all 23904 cold
    # experts, 56.4 GiB). The vision tower on the CPU takes 1.7 GiB and the pinned token embedding 1.2 GiB, and a video
    # up to ~1.5 GiB more while it is encoded, so the limit has ~4.4 GiB of headroom over the 66.6 GiB in use. The rest
    # of the RAM is left for the desktop.
    mem_limit: 71g
    memswap_limit: 71g
    ports:
      - "9931:8000"
    volumes:
      - /home/mika/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
      # The int8 dense checkpoint view, see above
      - /home/mika/.cache/vllm-models:/models:ro
      # Kernel caches (Humming, Triton): the first start compiles kernels, later starts reuse them.
      - flash-next-cache:/root/.humming
      - flash-next-triton-cache:/root/.triton
      # The experts that the RTX 3090 keeps (the first QWEN38_HOT_ONLY of each layer) and the Radeon VII the next ones,
      # ranked by their use in decode measured on chat, code and retrieval prompts instead of the runtime's static
      # ranking (README.md, Radeon VII experts).
      - ./rvii_experts/rankings-measured.json:/opt/qwen38-3090/configs/static_hot_cache_rankings.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m

  # The Radeon VII expert worker (rvii_experts/README.md): 135 experts per layer (ranks 24-158 of
  # rvii_experts/rankings-measured.json, 15.3 GiB) in the Radeon VII's VRAM. The first start packs them from the
  # checkpoint into ~/.cache/vllm-models/flash-next-rvii-measured (15 GB, ~15 s); later starts load them in ~8-18 s.
  rvii-experts:
    # Built by ../.github/workflows/deploy-docker-flash-next-rvii-experts.yml. Locally: docker build -t <the image> rvii_experts
    image: ghcr.io/agenttix/agx-ai/flash-next-rvii-experts:latest
    container_name: rvii-experts
    environment:
      # The RTX 3090 keeps the first QWEN38_HOT_ONLY experts of each layer.
      RVII_HOT: "24"
      RVII_PER_LAYER: "135"
      RVII_RANKINGS: /opt/rvii/rankings-measured.json
      RVII_CACHE: /root/.cache/vllm-models/flash-next-rvii-measured
      # Re-rank the worker's experts from their measured use (rerank.py, rvii_experts/README.md#automatic-re-ranking):
      # starts from RVII_RANKINGS, and when a new set of 135 experts per layer would serve 2 % more of the recent
      # decode requests, repacks its cache (in hot24-n135-auto/ of RVII_CACHE) and restarts the worker on it while the
      # runtime is idle. 0 = the fixed ranking of RVII_RANKINGS.
      RVII_AUTO_RERANK: "1"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    # The worker's polling thread on the serving processes' CPUs (QWEN38_MAIN_CPUS above), never on the CPU pool's or
    # the loaders' cores, whose threads spin: unpinned, it missed the 20 ms deadline once in a 40-min benchmark with
    # the loader threads (the CPU then computed its experts for that layer).
    cpuset: "0,3-4,7-8,11-12,15-16,19-20,23-24,27-28,31-32,35-36,39-40,43-44,47-48,51-52,55-56,59-60,63"
    volumes:
      - /home/mika/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
      - /home/mika/.cache/vllm-models:/root/.cache/vllm-models
    restart: unless-stopped

volumes:
  flash-next-cache:
  flash-next-triton-cache:
