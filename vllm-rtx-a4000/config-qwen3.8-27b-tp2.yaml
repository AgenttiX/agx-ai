# vllm serve --config for Qwen3.8-27B on both GPUs (tensor parallelism) without an embedding model: configuration 1.
# Benchmarks: README.md
# AWQ int4 with group size 32 (asymmetric, MSE observer); the Gated DeltaNet layers, the embedding, the lm_head and
# the MTP head are BF16. 19.6 GiB in total, 9.3 GiB per GPU without the vision tower.
model: cyankiwi/Qwen3.8-27B-AWQ-INT4
served-model-name: Qwen/Qwen3.8-27B
tensor-parallel-size: 2
# Peer-to-peer copies between the GPUs return corrupted data on this machine, so the custom all-reduce (which uses
# them) spins forever. NCCL without P2P (NCCL_P2P_DISABLE=1 in docker-compose.yml) is used instead.
disable-custom-all-reduce: true
# Do not load the vision tower, which would take memory from the KV cache.
language-model-only: true
# The KV cache holds 256682 tokens (4.46 GiB per GPU, int8); vLLM needs ~1.05 times the context, and 262144 did not
# fit.
max-model-len: 229376
gpu-memory-utilization: 0.95
# PaperQA2 sends 4 concurrent requests by default (PAPERQA_CONCURRENCY in paperqa_ask.py).
max-num-seqs: 8
# int8 with a scale per token and head, read by the pth-flash-attn kernel of ../vllm (CUSTOM, from HyperQwen, as in
# ../vllm-rtx3090): twice the context of BF16, and much faster generation at long contexts (README.md).
# FlashAttention 2 (the default on Ampere) supports no quantized KV cache.
kv-cache-dtype: int8_per_token_head
attention-backend: CUSTOM
# The recurrent state of the 48 Gated DeltaNet layers in FP16 instead of FP32 (as in HyperQwen): more tokens in the
# KV cache.
mamba-ssm-cache-dtype: float16
enable-prefix-caching: true
# Prefix cache blocks evicted from the GPU are kept in 8 GiB of pinned RAM, for returning to long conversations. It
# does not speed up PaperQA2, whose prompts fit in the KV cache on the GPUs (see README.md).
kv-offloading-size: 8
kv-offloading-backend: native
# Speculative decoding with the model's own MTP head: chat 37.5 -> 55.4 t/s. The drafter takes its attention
# backend from here.
speculative-config: {"method": "mtp", "num_speculative_tokens": 2, "attention_backend": "CUSTOM"}
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
# Sampling: generation_config.json of the model (temperature 1.0, top-k 20, top-p 0.95), as recommended by Qwen.
