version = 1

[PhaiModelLab/Phai-A1-35B-1M]
; Phai-A1-35B-1M with 262144 tokens of context: the same GGUF and settings as preset-phai-a1-35b-1m.ini (112640
; tokens), but with the experts of 22 instead of 12 of the 40 layers in RAM and computed by the CPU. See README.md.
model = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/Phai-A1-35B-1M-MTP-IQ4_XS.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/mmproj-F16.gguf
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 16144-16201 MiB of 16368 with a 260644-token prompt.
ctx-size = 262144
fit = off
flash-attn = on
; The experts in RAM need anonymous memory instead of mmap.
load-mode = none
load-on-startup = true
; 22 layers of experts in RAM (~8.6 GiB). Generation depends on the CPU even more than with 12 layers.
n-cpu-moe = 22
n-gpu-layers = all
; The vision encoder on the CPU.
no-mmproj-offload = 1
parallel = 1
spec-type = draft-mtp
; 3 drafts: 9 % faster in code edits, as fast otherwise, but 62 MiB more VRAM, too close to the limit.
spec-draft-n-max = 2
; As fast as 32 threads (8: 5-15 % slower), and half of the CPU stays free.
threads = 16
; Prompt processing copies the experts in RAM over PCIe 3.0 for every ubatch, so 2048 instead of 1024. A 260644-token
; prompt takes 14.5 min (299 t/s); with ubatch 1024 (and 20 layers on the CPU) it took longer than the benchmark's
; timeout.
ubatch-size = 2048
; Model parameters: generation_config.json of the model (as for Qwen3.6).
; top-k is not supported on ROCm (see preset-gemma-4-26b-a4b-qat.ini).
min-p = 0.0
temp = 1.0
top-p = 0.95

; Benchmarks: README.md
