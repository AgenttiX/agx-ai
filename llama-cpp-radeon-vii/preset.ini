version = 1

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; A q8_0 V cache (half the V memory) did not degrade long-context retrieval in the quality tests (README.md).
; Generation is about as fast as with the f16 cache and one layer's experts on the CPU up to 16k tokens of context,
; and 4-8 % slower beyond that, but the CPU stays free for other work on this desktop.
cache-type-v = q8_0
; Maximum without no-mmproj-offload
; ctx-size = 30208
; 75000 loads, but crashes with "ROCm error: out of memory" on the first long prompt (already at 20000 tokens).
; ctx-size = 75000
; The maximum with ubatch-size 1024. 53248 crashes on a full-context prompt.
; ctx-size = 51200
; Matches llama-cpp-agx-ai, so that the same agentic workloads can be split between the two. Fits entirely on the GPU
; with a q8_0 V cache and ubatch-size = 512 (peak 16257 MiB on a full-context prompt). See README.md for the alternatives.
ctx-size = 77824
fit = off
; The default "auto" already enables flash attention on ROCm (same speed as "on").
; Off is 35 % slower in generation at depth 16384 (58 vs 90 t/s).
flash-attn = on
load-mode = dio
load-on-startup = true
; n-cpu-moe = 1 with an f16 KV cache also fits and is 4-8 % faster in generation beyond 16k tokens of context, but it
; needs the CPU: up to ~17 threads' worth during generation, competing with other work on this desktop.
n-gpu-layers = all
no-mmproj-offload = 1
parallel = 1
spec-type = draft-mtp
; Fastest of 1-4 with real chat prompts (see README.md).
spec-draft-n-max = 2
; 1024 speeds up prompt processing by ~10 % compared to the default 512, but does not fit with ctx-size = 77824.
; 1536 is no faster, and 2048 runs out of memory.
; ubatch-size = 1024
ubatch-size = 512
; A q8_0 K cache is slower than a q8_0 V cache (see README.md).
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
; top-k is not supported on ROCm. This error message is emitted regardless of whether the top-k option is set.
; llama_sampler_backend_support: device 'ROCm0' does not have support for op TOP_K needed for sampler 'top-k'
; top-k = 64
top-p = 0.95

; Benchmarks: README.md
