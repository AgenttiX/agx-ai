version = 1

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; q8_0 K and V caches (half the KV memory) changed the answer-token distributions of long-context retrieval no more
; than a different ubatch size does, i.e. within the numerical noise (q4_0 was clearly above it); see README.md.
; They keep the model entirely on the GPU, so the CPU stays free for other work on this desktop.
cache-type-k = q8_0
cache-type-v = q8_0
; Maximum without no-mmproj-offload
; ctx-size = 30208
; 75000 loads, but crashes with "ROCm error: out of memory" on the first long prompt (already at 20000 tokens).
; ctx-size = 75000
; The maximum with ubatch-size 1024. 53248 crashes on a full-context prompt.
; ctx-size = 51200
; 77824 matches llama-cpp-agx-ai and fits entirely on the GPU with only a q8_0 V cache (peak 16266 MiB).
; ctx-size = 77824
; The maximum with the same headroom when K is also q8_0 (peak 16262 MiB on a full-context prompt). 90112 and 94208
; survive a full-context prompt with less headroom (peak 16301 and 16331 MiB); 98304 crashes on it. See README.md.
ctx-size = 88064
fit = off
; The default "auto" already enables flash attention on ROCm (same speed as "on").
; Off is 35 % slower in generation at depth 16384 (58 vs 90 t/s).
flash-attn = on
load-mode = dio
load-on-startup = true
; At ctx-size = 77824, n-cpu-moe = 1 with an f16 KV cache also fits and is 4-8 % faster in generation beyond 16k tokens
; of context, but it needs the CPU: up to ~17 threads' worth during generation, and when the CPU is busy with other
; work (all 64 threads), its generation drops by 67-78 % to ~25 t/s, whereas all on the GPU only loses 4-5 %.
n-gpu-layers = all
no-mmproj-offload = 1
parallel = 1
spec-type = draft-mtp
; Fastest of 1-4 with real chat prompts (see README.md).
spec-draft-n-max = 2
; 1024 speeds up prompt processing by ~10 % compared to the default 512, but does not fit with ctx-size >= 77824.
; 1536 is no faster, and 2048 runs out of memory.
; ubatch-size = 1024
ubatch-size = 512
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
; top-k is not supported on ROCm. This error message is emitted regardless of whether the top-k option is set.
; llama_sampler_backend_support: device 'ROCm0' does not have support for op TOP_K needed for sampler 'top-k'
; top-k = 64
top-p = 0.95

; Benchmarks: README.md
