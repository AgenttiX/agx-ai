version = 1

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; Maximum without no-mmproj-offload
; ctx-size = 30208
; 75000 loads, but crashes with "ROCm error: out of memory" on the first long prompt (already at 20000 tokens).
; ctx-size = 75000
; The maximum with ubatch-size 1024. 53248 crashes on a full-context prompt.
ctx-size = 51200
fit = off
; The default "auto" already enables flash attention on ROCm (same speed as "on").
; Off is 35 % slower in generation at depth 16384 (58 vs 90 t/s).
flash-attn = on
load-mode = dio
load-on-startup = true
n-gpu-layers = all
no-mmproj-offload = 1
parallel = 1
spec-type = draft-mtp
spec-draft-n-max = 2
; Speeds up prompt processing by ~10 % compared to the default 512. 1536 is no faster, and 2048 runs out of memory.
ubatch-size = 1024
; A q8_0 KV cache is slower (tg128 at depth 16384: 76 vs 90 t/s).
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
; top-k is not supported on ROCm. This error message is emitted regardless of whether the top-k option is set.
; llama_sampler_backend_support: device 'ROCm0' does not have support for op TOP_K needed for sampler 'top-k'
; top-k = 64
top-p = 0.95

; Benchmarks on 2026-09-26, Radeon VII (16368 MiB, nothing else on it), mixa3607/llama.cpp-gfx906:v0.3.0-rocm-7.14,
; benchmark/llama_cpp_bench_http.py (256 generated tokens, MTP on, 2 slots), prompt = ctx-size - 1500 tokens,
; peak VRAM from amd-smi:
; | Setup                        | Generation | Prompt processing   | 2 concurrent | Peak VRAM          |
; | ub 512, ctx 75000 (previous) | -          | OOM crash           | -            | 16344 MiB at load  |
; | ub 512, ctx 51200            | 127.6 t/s  | 923 t/s (49700)     | 98.5 t/s     | 15997 MiB          |
; | ub 1024, ctx 32768           | 126.7 t/s  | 1192 t/s (31268)    | 109.7 t/s    | 15988 MiB          |
; | ub 1024, ctx 45000           | 128.6 t/s  | 1068 t/s (43500)    | 108.4 t/s    | 16277 MiB          |
; | ub 1024, ctx 49152           | 126.2 t/s  | 1032 t/s (47652)    | 104.4 t/s    | 16353 MiB          |
; | ub 1024, ctx 51200 (this)    | 127.3 t/s  | 1011 t/s (49700)    | 108.6 t/s    | 16356 MiB          |
; | ub 1024, ctx 53248 / 56000   | -          | OOM crash           | -            | -                  |
; ctx 51200 was also stress-tested with 3 full-context prompts and 2 concurrent 24000-token prompts (peak 16357 MiB).
; llama-bench pp2048 with ub 256/512/1024/1536: 1133/1501/1851/1842 t/s (at depth 16384: 879/1073/1203/1151 t/s).
