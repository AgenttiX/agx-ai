version = 1

[PhaiModelLab/Phai-A1-35B-1M]
; A coding and agent fine-tune of Qwen3.6-35B-A3B (MoE, 3B active parameters) with a 1M-token context. The published
; checkpoint has no MTP weights, so this GGUF is built locally with the MTP head of Qwen3.6-35B-A3B grafted on
; (../vllm/graft_mtp.py) and mradermacher's imatrix (IQ4_XS, 17.85 GiB); see ../llama-cpp-rtx3090/README.md.
; IQ3_XXS (13.1 GiB) would fit entirely on the GPU with the same context and is 10-20 % faster, but it is clearly lossy:
; 148 instead of 154 of 176 retrieval answers right, mean KLD 0.068 against IQ4_XS (19 times the noise floor). See
; README.md.
model = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/Phai-A1-35B-1M-MTP-IQ4_XS.gguf
; model = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/Phai-A1-35B-1M-MTP-IQ3_XXS.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Phai-A1-35B-1M-MTP/mmproj-F16.gguf
; q8_0 K and V caches, as on the RTX 3090 (slightly above the noise floor, the same accuracy as f16).
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 16212 MiB of 16368 with a 111140-token prompt (116736: 16341 MiB, too close to the limit).
ctx-size = 112640
fit = off
flash-attn = on
; The experts in RAM need anonymous memory instead of mmap (as for ../llama-cpp-rtx3090/preset-qwen3.8-flash-next.ini).
load-mode = none
load-on-startup = true
; The experts of 12 of the 40 layers are in RAM and computed by the CPU (400 MiB per layer). This makes generation
; dependent on the CPU: with all 64 threads busy with other work, chats drop from 64 to 27 t/s (median 12 t/s), whereas
; the IQ3_XXS file entirely on the GPU keeps 71 t/s.
n-cpu-moe = 12
n-gpu-layers = all
; The vision encoder on the CPU: an image of 1280x960 takes ~10 s.
no-mmproj-offload = 1
parallel = 1
spec-type = draft-mtp
; Without MTP, chats are 6 % and generation at 36.5k tokens of context 36 % slower (measured with IQ3_XXS). 3 drafts
; were not faster.
spec-draft-n-max = 2
; As fast as the default 32 threads (63.8 vs 64.7 t/s in chats; 8 threads: 60.7 t/s), and half of the CPU stays free.
threads = 16
; pp2048: 1415 t/s vs 1073 t/s with 512 (IQ3_XXS, all on the GPU).
ubatch-size = 1024
; Model parameters: generation_config.json of the model (as for Qwen3.6).
; top-k is not supported on ROCm (see preset-gemma-4-26b-a4b-qat.ini).
min-p = 0.0
temp = 1.0
top-p = 0.95

; Benchmarks: README.md
