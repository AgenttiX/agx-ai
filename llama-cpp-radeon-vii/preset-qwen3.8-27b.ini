version = 1

[Qwen/Qwen3.8-27B]
; UD-Q4_K_M (16.5 GB) does not fit in the 16 GB. UD-IQ4_XS (14.3 GB) is the largest quant that fits with a useful
; context, and on gfx906 it is also faster than the smaller UD-Q3_K_XL and UD-IQ3_S (see README.md).
hf = unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS
; q8_0 K and V caches change the answer-token distributions no more than a different ubatch size does (within the
; noise), and generate within 3 % of the speed of f16. An f16 cache would allow only ~28k tokens of context.
; q4_0 would allow ~63k tokens, but it is clearly above the noise.
cache-type-k = q8_0
cache-type-v = q8_0
; Peak 16298 MiB of 16368 in the benchmarks with a full-context prompt (the same as preset-gemma-4-26b-a4b-qat.ini).
; 49152 survived the benchmarks too, but peaked at 16346 MiB.
ctx-size = 47104
fit = off
; The default "auto" already enables flash attention on ROCm.
flash-attn = on
; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
; image-min-tokens = 1024
load-mode = dio
load-on-startup = true
n-gpu-layers = all
; The vision encoder on the CPU frees 1.1 GB of VRAM (~26k tokens of context) and makes a 1280x960 image ~4 s slower.
no-mmproj-offload = 1
parallel = 1
; MTP is 18 % faster in chat and 25 % faster at 16k tokens of context than no speculative decoding; it costs 0.8 GB.
spec-type = draft-mtp
; Fastest of 1-4 (see README.md).
spec-draft-n-max = 2
; 1024 speeds up prompt processing by only 4 % for +250 MB (~6k tokens of context).
ubatch-size = 512
; Model parameters
; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
min-p = 0.0
temp = 1.0
top-k = 20
top-p = 0.95

; Benchmarks: README.md
