version = 1

[thinkingmachines/Inkling-2-Mini]
; Inkling 2 Mini (Thinking Machines, 2026-11-20): a 26B MoE (128 experts, 8 active) whose middle 12 of its 24 layers
; run three times per token with shared weights, with a DSpark block drafter. Needs docker-compose-inkling.yml (its
; ROCm image is llama.cpp b12627 with the drafter of the open pull request #32218). See README.md.
; Unsloth's UD-IQ3_XXS (10.9 GiB, the file of Mainline_Support/ for upstream llama.cpp), the largest quant that fits
; entirely on the GPU with a useful context. With the experts in RAM, every token would read them three times for the
; 12 layers of the loop.
model = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/Inkling-2-Mini-UD-IQ3_XXS.gguf
mmproj = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/mmproj-BF16.gguf
; Unsloth's DSpark drafter (0.4 GB). 2 drafts: chats 12 % and generation at 6.4k tokens of context 29 % faster than
; without it; 3 drafts edit code 7 % faster, but are slower otherwise (see README.md).
model-draft = /root/.cache/huggingface/hub/local-gguf/Inkling-2-Mini/dspark-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 2
; 8 layers of KV (the 4 global-attention layers, each pass of the loop with its own), 17 KiB per token with q8_0.
cache-type-k = q8_0
cache-type-v = q8_0
; 131072 tokens crashed during a full-context prompt (16068 MiB of 16368 already after loading), 98304 peaked
; at 16358 MiB. Peak 15975 MiB with a 88612-token prompt.
ctx-size = 90112
fit = off
flash-attn = on
load-mode = none
load-on-startup = true
n-gpu-layers = all
; The vision encoder on the CPU.
no-mmproj-offload = 1
parallel = 1
; The relative-position bias is a [heads x context x ubatch] F32 tensor (see ../llama-cpp-rtx3090/README.md): ubatch
; 512 would cost ~10 GiB at this context. Prompt processing at 6.4k tokens: 216 t/s with 64, 353 t/s with 512.
ubatch-size = 64
; Model parameters: generation_config.json of the model (temperature 1.0). top-k is not supported on ROCm.
min-p = 0.0
temp = 1.0
top-p = 1.0

; Benchmarks: README.md
