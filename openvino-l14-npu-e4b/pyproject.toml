# Python dependencies of the converter that prepares Gemma 4 E4B for OVMS on the NPU (see Dockerfile and convert.py).
# Update the lock file with "uv lock" in Ubuntu 26.04 with its system Python (see README.md).
[project]
name = "gemma4-ov-convert"
version = "0.1.0"
description = "Converter of Gemma 4 E4B to symmetric INT4 OpenVINO IR for OpenVINO Model Server on the Intel NPU"
# Ubuntu 26.04 includes Python 3.14.
requires-python = "==3.14.*"
# The IR is version-independent, so OpenVINO does not have to match the OVMS image exactly,
# but it is updated together with it (see ../.github/dependabot.yml).
dependencies = [
    "huggingface-hub",
    "nncf==3.4.0",
    "openvino==2026.4.1",
]

[tool.uv]
# The converter is run as a script, not installed as a package.
package = false
