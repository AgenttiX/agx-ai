# Gemma 4 E4B on the NPU of the ThinkPad L14 Gen 5 with OpenVINO Model Server (OVMS). See README.md for the notes.
services:
  # Converts the model to symmetric INT4 on the first start (and after updates of the converter), then exits.
  convert:
    image: ghcr.io/agenttix/agx-ai/gemma4-ov-convert:latest
    container_name: gemma4-convert
    environment:
      # The model files are downloaded to the Hugging Face cache of the host.
      # Only the hub directory is mounted, so that e.g. a token in ~/.cache/huggingface is not visible.
      HF_HUB_CACHE: /hf-hub
    # Run as the host user, so that the files in the Hugging Face cache are not owned by root.
    user: "1000:1000"
    volumes:
      - /home/mika/.cache/huggingface/hub:/hf-hub
      - models:/models

  ovms-gemma4:
    # 2026.5.0 (weekly build of 2026-11-19). Its prefill is 1.7x faster than in 2026.4.1 (see README.md).
    image: openvino/model_server@sha256:6c496c2e4c0110d4544c5f09139625637fd34dde5ba8064553443e6321ab1da4
    container_name: ovms-gemma4
    command: [
      "--rest_port", "8000",
      "--model_path", "/models/gemma-4-E4B-it-int4-sym-ov",
      "--model_name", "google/gemma-4-e4b-it-npu",
      "--task", "text_generation",
      "--target_device", "NPU",
      # The prompt limit. The NPU runs the prompt as one static graph of this size, so every prompt takes the same
      # time (3.3 s). Longer limits need chunked prefill, which gives wrong output or does not compile on NPU 3720.
      "--max_prompt_len", "1024",
      # BEST_PERF: compile the generation model as one graph. The default (FAST_COMPILE) folds the layers into
      # repeated subgraphs, which give garbage on NPU 3720. The prefill model is compiled as one graph for the same
      # reason ("++" adds to its default configuration).
      "--plugin_config", '{"NPUW_LLM_GENERATE_HINT":"BEST_PERF","++NPUW_LLM_PREFILL_CONFIG":"{NPUW_ONLINE_PIPELINE:NONE}"}',
      "--tool_parser", "gemma4",
      "--reasoning_parser", "gemma4",
      # Compiled NPU blobs, so that later starts are faster.
      "--cache_dir", "/models/ov_cache",
    ]
    depends_on:
      convert:
        condition: service_completed_successfully
    devices:
      - /dev/accel:/dev/accel
    # /dev/accel/accel0 belongs to the host's render group, whose name does not exist in the image (getent group render).
    group_add:
      - "992"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9934:8000"
    # The converted model and the compilation cache are writable by any user, see the Dockerfile.
    user: "1000:1000"
    volumes:
      - models:/models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/v2/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start compiles the model for the NPU (~3 min).
      start_period: 600s

volumes:
  # The converted model (6.1 GB) and the NPU compilation cache (4.3 GB).
  models:
