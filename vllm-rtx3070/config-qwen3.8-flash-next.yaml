# vllm serve --config for Qwen3.8-Flash-Next on the RTX 3070 (8 GB) of agx-ai, with its experts in RAM.
# Benchmarks: README.md. Needs the fixes of ../vllm/vllm.patch of 2026-10-13 (UVA weight offloading, the vision tower
# on the CPU, the FP8 KV cache on sm_86).
# Built with quantize_flash_next_dense.py (--bits 8 --lm-head-bits 4) from albucino/Qwen3.8-Flash-Next-W4A16-FP8PLE:
# the routed experts in Intel's AutoRound int4 and the n-gram table in FP8 as in the source, the Gated DeltaNet,
# attention and shared expert projections in int8 and the lm_head in int4 (round-to-nearest, group size 128) instead
# of BF16, so that the weights that stay on the GPU take ~4.8 GiB instead of 8.0 GiB. The int4 lm_head (-0.3 GiB,
# ~12k tokens of context) changed the answer distributions less than the FP8 KV cache (see README.md).
model: /models/Qwen3.8-Flash-Next-W4A16-FP8PLE-dense-int8-head4
served-model-name: Qwen/Qwen3.8-Flash-Next
# The routed experts (58.4 GiB) and the token embedding (1.2 GiB) are in pinned RAM, and the GPU reads them directly
# over PCIe (UVA, zero-copy). The MoE kernel reads only the 10 experts per layer that the router selects (~1.2 GB per
# token), so generation is bound by PCIe 4.0 x16. cpu-offload-gb is only an upper limit here.
# The n-gram table (47.6 GiB in FP8) is in pinned RAM too (engram-config cpu_offload, the default for this model).
# In total ~107 GiB of the container's RAM are pinned.
offload-backend: uva
cpu-offload-gb: 100
cpu-offload-params: [experts, embed_tokens]
# FP8 KV cache (e4m3, read with a bit conversion on sm_86, see ../vllm/vllm.patch). The attention pages of this
# hybrid model are as large as its Gated DeltaNet state pages (1568 tokens per page in BF16, 3136 in FP8), so FP8
# roughly halves the memory per token of all cache groups: 1.1 GB held 24041 tokens in BF16 and 42598 in FP8. In the
# retrieval test, it changed the answer distributions only slightly (mean KL divergence 0.0056, noise floor 0.0020).
kv-cache-dtype: fp8
# The KV cache below holds 63488 tokens; vLLM needs ~1.1 times the context. Peak 7342 MiB with a 56000-token prompt.
max-model-len: 57344
kv-cache-memory-bytes: 1300000000
gpu-memory-utilization: 0.9
# The prefill chunk. 4096 would stream the experts half as often, but ran out of GPU memory even with a 1.0 GB KV
# cache.
max-num-batched-tokens: 2048
# CUDA graphs for single-token decoding: twice as fast as eager mode (15.3 vs 7.4 t/s in chat).
compilation-config: {"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1]}
max-num-seqs: 1
# No MTP: its module (2.6B parameters, an estimated ~1.4 GB on the GPU even with its experts in RAM) does not fit.
enable-prefix-caching: true
# Prefix cache blocks evicted from the GPU are kept in 8 GiB of RAM (/dev/shm), so that a returning conversation needs
# no new prompt processing: an 8961-token conversation that two 18k-token prompts had evicted came back in 5.7 s
# (358 MB loaded) instead of 22.6 s. ~34 KB per stored token (attention KV and Gated DeltaNet states), i.e. room for
# ~250k tokens. Together with the vision tower, this needs the 144 GiB of the container (since 2026-10-13). See
# README.md.
kv-offloading-size: 8
kv-offloading-backend: native
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
# Sampling: generation_config.json of the model.
# Image and video input with the vision tower on the CPU (QWEN38_VISION_DEVICE=cpu in docker-compose.yml, see
# ../vllm/vllm.patch): no VRAM for it and an unchanged text speed. The CPU needs ~3 ms per 16x16 patch with 16
# threads, so the sizes are limited as on agx-z2e: images to 1 megapixel (~1000 tokens, ~15 s until the first token),
# videos to 64 frames sampled at 2 per second (only these are decoded) and 12.6 M pixels over all frames (~6000 tokens,
# 66-74 s for a 30-s 1080p clip). Encoder profiling with a dummy input of the maximum size would take minutes on the CPU.
limit-mm-per-prompt: {"image": 4, "video": 1}
mm-processor-kwargs: {"max_pixels": 1048576, "videos_kwargs": {"max_pixels": 12582912}}
media-io-kwargs: {"video": {"max_frames": 64}}
skip-mm-profiling: true
