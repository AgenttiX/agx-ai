# vllm serve --config for Qwen3.8-27B on the Radeon VII. Benchmarks: README.md
# GPTQ int4 (group size 128) with int4 embedding and lm_head, 13.25 GiB on the GPU without the vision tower.
# The mtp-int8 revision has the MTP head in int8 (0.4 GiB instead of 0.8); the weights are otherwise the same.
model: JRamirez-UAB/Qwen3.8-27B-GPTQ-W4A16-embed-int4-24GB
revision: mtp-int8
served-model-name: Qwen/Qwen3.8-27B
# gfx906 has no native bf16.
dtype: float16
# Images and videos with the vision tower on the CPU (GEMMA4_VISION_DEVICE and QWEN38_VISION_DEVICE in
# docker-compose.yml, cpu_vision_*.py), which takes no VRAM. Up to 64 images per request, as agent sessions collect
# screenshots, and 1 video. No encoder profiling, which would take minutes on the CPU.
limit-mm-per-prompt: {"image": 64, "video": 1}
skip-mm-profiling: true
# Images scaled down to 1 megapixel (~1000 tokens) as in ../vllm-rtx3090-hyperqwen, videos sampled at 2 frames per
# second, at most 64 frames and 4.2 megapixels over all frames (~2000 tokens): with the 12.6 megapixels of
# HyperQwen's configuration, the VRAM peak was 55 MiB over that of the longest text prompt (see README.md).
mm-processor-kwargs: {"max_pixels": 1048576, "videos_kwargs": {"max_pixels": 4194304}}
media-io-kwargs: {"video": {"max_frames": 64}}
# The rotary embedding cache is allocated for max_position_embeddings (262144 tokens); limiting it to the context frees
# 0.11 GiB for the KV cache, ~3k tokens.
hf-overrides: {"text_config": {"max_position_embeddings": 33792}}
# The maximum with the KV cache below. Peak 16285 MiB of 16368 in the stress test (a 32300-token prompt).
max-model-len: 33792
# Set explicitly instead of gpu-memory-utilization, whose profiling leaves ~0.8 GiB unused on this GPU.
# 0.32 GiB of it is the recurrent state of the 48 Gated DeltaNet layers, the rest ~33 KiB per token.
kv-cache-memory-bytes: 1520000000
# The custom gfx906 flash attention supports only an fp16 KV cache, which allows only ~11k tokens of context.
# int8 with a scale per token and head (the format closest to llama.cpp's q8_0) needs the Triton attention, which is
# ~8 % slower at 6.4k tokens of context and faster in short chats (see README.md).
kv-cache-dtype: int8_per_token_head
attention-backend: TRITON_ATTN
# One request at a time, like parallel = 1 of the llama.cpp preset.
max-num-seqs: 1
# The prefill chunk. Larger chunks need more activation memory.
max-num-batched-tokens: 512
# CUDA graphs only for single-token decoding: capturing the default 51 sizes takes several GiB.
compilation-config: {"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1]}
enable-prefix-caching: true
# Prefix cache blocks evicted from the GPU are kept in 8 GiB of pinned RAM, so that a returning conversation needs
# no new prompt processing. Needs VLLM_USE_V2_MODEL_RUNNER=0.
kv-offloading-size: 8
kv-offloading-backend: native
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
# Sampling: generation_config.json of the model (temperature 1.0, top-k 20, top-p 0.95), as recommended by Qwen.

# MTP (speculative decoding with the model's own MTP head) is 15-18 % faster, but the MTP head and the recurrent
# states of the drafted positions leave room for much less context (see README.md). With one drafted token
# (measured before the hf-overrides above, which would allow ~3k tokens more):
# max-model-len: 9216
# kv-cache-memory-bytes: 900000000
# compilation-config: {"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2]}
# speculative-config: {"method": "mtp", "num_speculative_tokens": 1}
