version = 1

; Both models run in the same llama-server router. The GPU model and the CPU-only model are not used at the same time,
; so each is tuned for running alone. See README.md for the measurements behind these settings.

[google/gemma-4-26b-a4b-qat]
; Google's official version
; hf = google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
; hf-repo-draft = google/gemma-4-26B-A4B-it-assistant
; Unsloth with MTP
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB). See README.md.
cache-ram = 16384
; The maximum with ubatch-size = 2048 and n-cpu-moe = 28 (peak 7655 MiB with a 119k-token prompt). See README.md.
; The KV cache is kept at f16: q8_0 does not reduce the quality measurably, but slows down generation at long contexts
; more (-18 % at 70k tokens) than putting more experts on the CPU for the same context size (-2 %). See README.md.
ctx-size = 122880
fit = off
flash-attn = on
; Hybrid CPU+GPU inference with mmap would result in this warning:
; llama_model_loader: tensor overrides to CPU are used with mmap enabled - consider using --load-mode none for better performance
load-mode = none
load-on-startup = true
; Total layers = 30. All layers are on the GPU, except for the experts of 28 layers, which are on the CPU.
; Each additional layer of experts on the CPU makes room for ~16k tokens of context, for a few % of speed.
n-cpu-moe = 28
n-gpu-layers = all
no-mmproj-offload = 1
; The MTP drafter is found automatically from the repository root (mtp-gemma-4-26B-A4B-it.gguf, a "smart Q4_0",
; 240 MiB). Unsloth also publishes Q8_0 (440 MiB), F16 and BF16 (816 MiB) versions in the MTP/ folder, which may
; accept slightly more draft tokens. They take more VRAM, so n-cpu-moe likely has to be increased by 1 (Q8_0) or 2 (BF16).
; To try one, download it into the Hugging Face cache (see README.md) and point to it:
; model-draft = /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/7b92b5b28818151e8669af2e45e88d6086f490dd/MTP/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
parallel = 1
spec-type = draft-mtp
spec-draft-n-max = 2
threads = 12
; Fewer weight copies over PCIe during prompt processing. 1024 would make room for ~30k more tokens of context,
; but prompt processing is 20 % and chat 15 % slower.
; Requires the 1600 MHz clock lock or the 170 W power limit (gpu-power-limit/), as the GPU crashes with Xid 79
; without them. See README.md.
; Without them, use no-op-offload = 1 instead of ubatch-size = 2048, with n-cpu-moe = 22 and ctx-size = 65536.
ubatch-size = 2048
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[llmfan46/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-GGUF]
hf = llmfan46/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-GGUF:Q4_0
; mmproj = /models/llmfan46/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-GGUF/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-mmproj-BF16.gguf
; model = /models/llmfan46/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-GGUF/gemma-4-26B-A4B-it-qat-q4_0-uncensored-heretic-Q4_0.gguf
; Host RAM for the prompt caches of conversations that are not in a slot (default 8192 MiB). See README.md.
cache-ram = 16384
ctx-size = 75000
; CPU only: no CUDA devices for the model or the MTP drafter, so that all VRAM is left for the GPU model.
device = none
flash-attn = on
load-mode = mmap+mlock
load-on-startup = true
; Unsloth's MTP drafter for the original model, as no uncensored version ships its own. See README.md.
; The path is pinned to a snapshot, as there is no --hf-file equivalent for the draft model.
model-draft = /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/7b92b5b28818151e8669af2e45e88d6086f490dd/mtp-gemma-4-26B-A4B-it.gguf
; Higher-precision drafters (Q8_0 440 MiB, F16/BF16 816 MiB of RAM) may accept slightly more draft tokens, but also
; take longer to run on the CPU. To try one, download it into the Hugging Face cache (see README.md) and use e.g.:
; model-draft = /root/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-qat-GGUF/snapshots/7b92b5b28818151e8669af2e45e88d6086f490dd/MTP/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
no-mmproj-offload = 1
spec-type = draft-mtp
spec-draft-n-max = 2
threads = 16

;[Qwen/Qwen3.8-27B]
;; hf = lmstudio-community/Qwen3.8-27B-GGUF:Q4_K_M
;hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
;; mmproj = /models/lmstudio-community/Qwen3.8-27B-GGUF/mmproj-Qwen3.8-27B-BF16.gguf
;; model = /models/lmstudio-community/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
;ctx-size = 50000
;; load_hparams: Qwen-VL models require at minimum 1024 image tokens to function correctly on grounding tasks
;; load_hparams: if you encounter problems with accuracy, try adding --image-min-tokens 1024
;; load_hparams: more info: https://github.com/ggml-org/llama.cpp/issues/16842
;; image-min-tokens = 1024
;load-mode = mmap+mlock
;load-on-startup = true
;spec-type = draft-mtp
;; Model parameters
;; https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp
;min-p = 0.0
;temp = 1.0
;top-k = 20
;top-p = 0.95
