# llama.cpp router server for the ThinkPad L14 Gen 5 (Intel Core Ultra 5 125U, Intel Graphics iGPU, 32 GB RAM).
# Models, their settings and the benchmark notes (CPU vs. iGPU vs. NPU) are in preset.ini; server-wide settings in config.ini.
# The NPU is used by a separate server in ../openvino-agx-l14. Do not run both at the same time: together they
# exhausted the 32 GB of RAM and the kernel killed the desktop session.
services:
  llama-cpp:
    # The Vulkan image contains both the Vulkan (iGPU) and the CPU backends.
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-cpp
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - path: ./llama-cpp.env
        required: false
    # The group names do not exist in the image, so use the host's GIDs (getent group video render).
    group_add:
      - "44"
      - "992"
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - /home/mika/.cache/huggingface/hub:/root/.cache/huggingface/hub
      - ./config.ini:/etc/llama.cpp/config.ini:ro
      - ./preset.ini:/etc/llama.cpp/preset.ini:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9931/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
