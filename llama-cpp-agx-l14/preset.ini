version = 1

; Configuration for the ThinkPad L14 Gen 5: Intel Core Ultra 5 125U (2 P-cores with HT + 8 E-cores + 2 LP E-cores),
; Intel Graphics iGPU (Meteor Lake, 4 Xe cores), Meteor Lake NPU (NPU 3720), 32 GB RAM shared by all of them.
;
; The Gemma models run on the CPU (device = none, i.e. the ggml CPU backend of the OpenVINO image), as it was the
; fastest and the only reliable option for token generation. Everything is limited by the memory bandwidth, which the
; CPU, iGPU and NPU share, so splitting a model between them does not add bandwidth.
; The OpenVINO backend is used only for the NPU model at the bottom (GGML_OPENVINO_DEVICE=NPU in docker-compose.yml).
; Measured on 2026-09-25/26 (build b11176, tg = token generation, pp = prompt processing, t/s).
;
; llama bench (-fa 1, no speculative decoding), UD-Q4_K_XL:
;   Backend (image)                E4B pp512  E4B tg64  12B pp512  12B tg64  26B-A4B pp512  26B-A4B tg64
;   CPU 4 threads (server)         -          -         11         3.9       -              -
;   CPU 6 threads                  31         10.0      12         4.5       -              -
;   CPU 8 threads                  35         10.7      -          -         34             12.6
;   CPU 10 threads                 37         10.6      15         5.0       37             12.1
;   CPU 12 threads                 -          -         11         4.7       -              -
;   Vulkan iGPU (server-vulkan)    128        8.3       51         3.7       97             9.7
;   SYCL iGPU (server-intel)       135        8.5       53         4.7       65             6.6
;   OpenVINO iGPU (server-openvino) 260       10.0      107        5.5       fails ("failed to decode prompt batch")
;   OpenVINO CPU                   52         6.0       -          -         -              -
;   OpenVINO NPU                   fails      fails     fails      fails     fails          fails
; - OpenVINO on the iGPU would process E4B and 12B prompts 7-8x faster at about the same generation speed, but it
;   cannot run the 26B-A4B MoE, does not support multimodal input, and the OpenVINO backend can only use one device
;   per container (GGML_OPENVINO_DEVICE), which is the NPU here.
; - Vulkan with the MoE experts on the CPU (n-cpu-moe 20/30) generated only 0.5-0.7 t/s, and CPU weights with
;   Vulkan op offload for prompt processing (device Vulkan0, n-gpu-layers 0) took 552 s for 193 tokens.
;
; llama-server over HTTP (benchmark/llama_cpp_bench_http.py, results in benchmark/results/agx-l14-kubuntu.jsonl).
; The CPU backend is as fast in the OpenVINO image as in the plain CPU image (server):
; - 26B-A4B CPU 8 threads, MTP 2: tg 15.2 t/s (acc 85 %), pp 31 t/s for 2048 tokens (CPU image)
;                                 tg 15.8 t/s, pp 30 t/s (OpenVINO image)
;   256-token runs, MTP 2 vs. none: 13.1-14.1 vs. 11.9 t/s, so MTP gives ~10-20 %.
; - 26B-A4B Vulkan all layers, MTP 2: tg 10.7 t/s (acc 85 %), pp 48 t/s
; - 12B CPU 8 threads: no MTP tg 4.9 t/s (4.7 in the OpenVINO image), MTP 1 4.7 t/s, MTP 2 4.2 t/s, MTP 3 4.9 t/s;
;   pp 13 t/s. MTP does not help the dense 12B on the CPU, as verifying the draft costs as much as it saves.
; - 12B Vulkan all layers, MTP 2: "ggml_vulkan: device lost" (vk::Queue::submit: ErrorDeviceLost) on a 2048-token prompt.
; - E4B CPU 8 threads: no MTP tg 13.8 t/s, MTP 2 tg 10.0 t/s (acc 48 %); pp 35-36 t/s for 2048 tokens.
; The results vary by ~10 % between runs, and the first benchmark after loading a model can be much slower
; (26B: tg 5.3 t/s) while the pages that other programs pushed to swap are read back.
;
; NPU (OpenVINO backend, GGML_OPENVINO_DEVICE=NPU):
; - Gemma 4 does not run on this NPU. E4B UD-Q4_K_XL (unsloth QAT), gemma-4-E4B_q4_0-it (Google's QAT Q4_0) and
;   Q4_K_M (bartowski, validated on the Lunar Lake NPU in llama.cpp docs/backend/OPENVINO.md) all compile for ~10 min
;   and then fail even with ctx 512: "L0 pfnAppendGraphExecute result: ZE_RESULT_ERROR_UNINITIALIZED ...
;   driver is not initialized" followed by "llama_decode: failed to decode, ret = -3". 12B and 26B-A4B fail as well.
;   The kernel driver (intel_vpu, firmware vpu_37xx 20260219) and the container's user-mode driver (1.38) are fine,
;   as small models work.
; - The NPU compiles a static graph for the whole context, so its per-token cost grows with ctx-size.
;   Qwen3-0.6B Q4_K_M (llama completion, 64 tokens): ctx 256 tg 14.8, ctx 1024 tg 0.8, ctx 4096 tg 0.2 t/s.
; - Qwen3 Q4_K_M at ctx 1024 (llama completion), NPU vs. OpenVINO CPU vs. OpenVINO iGPU:
;   0.6B tg 0.8 / 19.3 / 19.3, 1.7B tg 0.8 / 12.9 / 15.8, 4B tg 0.6 / 6.2 / 9.8.
; - Through the router: Qwen3-4B on the NPU tg 2.0 t/s at ctx 512 and 0.6 t/s at ctx 1024, ~50 s to load (NPU
;   compilation, GGML_OPENVINO_COMPILED_MODEL_CACHE_DIR stays empty on the NPU). The same model on the CPU (device = none)
;   generates 16 t/s. Qwen3-0.6B on the NPU at ctx 512 (tg 3.4 t/s) answered "Kemi" and "Turku" for the capital of Finland.
; - In short, the NPU works with llama.cpp only for small models with a tiny context, and even then it is several
;   times slower than the CPU. For real use of the NPU, see OpenVINO GenAI / OpenVINO Model Server with the
;   NPU-optimized models (e.g. OpenVINO/Qwen3-8B-int4-cw-ov), which use a stateful pipeline instead.
;
; Memory: the 26B-A4B llama-server process uses ~20.6 GB RSS (weights, the CPU_REPACK copy of the Q4_0 tensors,
; mmproj, MTP drafter and KV cache), so only one model fits at a time (models-max = 1 in config.ini).
; Requesting another model through the router unloads the loaded one.
; Threads: 8-10 is the sweet spot. 12 threads was slower, presumably as the slow LP E-cores hold the others back.

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
device = none
load-on-startup = true
parallel = 1
spec-draft-n-max = 2
spec-type = draft-mtp
threads = 8
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-12b-qat]
hf = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
device = none
parallel = 1
; MTP does not speed up this model on the CPU, see above.
threads = 8
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-e4b-qat]
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
device = none
parallel = 1
; MTP slows this model down on the CPU, see above.
threads = 8
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

; The only model on the NPU, as a demonstration: the CPU runs it 8x faster (see above).
[qwen/qwen3-4b-npu]
hf = Qwen/Qwen3-4B-GGUF:Q4_K_M
; The NPU is usable only with a tiny context: ctx 1024 is 3x slower than 512.
ctx-size = 512
device = OPENVINO0
; The NPU does not support parallel sequences.
parallel = 1
; Model parameters
; https://huggingface.co/Qwen/Qwen3-4B-GGUF#best-practices
min-p = 0.0
temp = 0.6
top-k = 20
top-p = 0.95
