version = 1

; Configuration for the ThinkPad L14 Gen 5. See README.md for the benchmarks and the reasoning behind the settings.

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
; Checkpoints make every request ~10 s slower on Vulkan, see README.md.
ctx-checkpoints = 0
device = Vulkan0
fit = off
; Flash attention is slow on this iGPU and caused GPU hangs, see README.md.
flash-attn = off
load-on-startup = true
n-gpu-layers = all
parallel = 1
; MTP did not speed up this model on the iGPU, see README.md.
; spec-draft-n-max = 2
; spec-type = draft-mtp
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-12b-qat]
hf = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
; Checkpoints make every request ~10 s slower on Vulkan, see README.md.
ctx-checkpoints = 0
device = Vulkan0
fit = off
; Flash attention is slow on this iGPU and caused GPU hangs, see README.md.
flash-attn = off
n-gpu-layers = all
parallel = 1
; MTP did not speed up this model on the CPU, see README.md.
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[google/gemma-4-e4b-qat]
hf = unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL
ctx-size = 50000
; Checkpoints make every request ~10 s slower on Vulkan, see README.md.
ctx-checkpoints = 0
device = Vulkan0
fit = off
; Flash attention is slow on this iGPU and caused GPU hangs, see README.md.
flash-attn = off
n-gpu-layers = all
parallel = 1
; MTP slowed this model down on the CPU, see README.md.
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

; Qwen3-4B on the NPU through the OpenVINO image (server-openvino, GGML_OPENVINO_DEVICE=NPU), as a demonstration:
; the CPU runs it 8x faster (see README.md). Replaced by ../openvino-agx-l14.
;[qwen/qwen3-4b-npu]
;hf = Qwen/Qwen3-4B-GGUF:Q4_K_M
;; The NPU is usable only with a tiny context: ctx 1024 is 3x slower than 512.
;ctx-size = 512
;device = OPENVINO0
;; The NPU does not support parallel sequences.
;parallel = 1
;; Model parameters
;; https://huggingface.co/Qwen/Qwen3-4B-GGUF#best-practices
;min-p = 0.0
;temp = 0.6
;top-k = 20
;top-p = 0.95
