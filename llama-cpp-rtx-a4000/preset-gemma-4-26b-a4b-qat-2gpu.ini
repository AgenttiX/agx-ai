version = 1

; Gemma 4 26B-A4B QAT and the embedding model on both GPUs, everything on the GPUs.
; The VRAM, speed and PaperQA2 results, also with some experts on the CPU (slower), are in README.md.

[google/gemma-4-26b-a4b-qat]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
; Host RAM for saving the prompt caches of conversations that are not in a slot (default 8192 MiB).
cache-ram = 16384
; The model's maximum. The KV cache takes 20 KiB per token (5 GiB), shared by the slots (kv-unified in config.ini).
ctx-size = 262144
fit = off
flash-attn = on
load-mode = mmap
load-on-startup = true
n-gpu-layers = all
no-mmproj-offload = 1
; PaperQA2 sends up to 4 concurrent requests by default (answer.max_concurrent_requests).
parallel = 4
spec-type = draft-mtp
spec-draft-n-max = 2
; Tensor split loads, but the first request crashes in the flash attention (fattn.cu:762: fatal error).
split-mode = layer
; 1:1 ran out of memory on GPU 1, which also has the output layer and more of the embedding model.
tensor-split = 4,3
; With the layer split, llama.cpp keeps several copies of the compute buffers for pipeline parallelism:
; with 2048, Gemma asked for 5 GiB on GPU 0.
ubatch-size = 1024
; Model parameters
; https://unsloth.ai/docs/models/gemma-4/qat#llama-server-deployment
temp = 1.0
top-k = 64
top-p = 0.95

[Qwen/Qwen3-Embedding-4B]
; The 4B model retrieved as well as the 8B model (Q6_K) on the PaperQA2 corpus, at 1.6 times the speed and with
; 1.5 GiB less VRAM per GPU, which the NCCL all-reduce of the tensor split (since ~b11500) and the context of the LLM
; need. See ../vllm-rtx-a4000/README.md#embedding-models. Changing the model starts a new PaperQA2 index.
hf = Qwen/Qwen3-Embedding-4B-GGUF:Q6_K
; PaperQA2 uses 5000-character chunks (parsing.reader_config chunk_chars) by default, which is ~1100 tokens of
; PDF text and up to ~3500 tokens for reference lists and tables. A single input larger than ubatch-size is processed
; in several batches, as the model is causal. The compute buffer is ~600 MiB per 1024 tokens of ubatch-size, as it
; includes the logits for the whole vocabulary: 4096 did not fit next to the LLM.
batch-size = 4096
; The KV cache (ctx-size) is shared by the parallel slots (kv-unified in config.ini). A 5000-character chunk of
; PDF text is ~1100 tokens, but reference lists and tables tokenise to ~3500 tokens, so two concurrent chunks
; exceeded a 4096-token cache ("Context size has been exceeded", 2026-09-19). The embedding model therefore runs
; with a single slot and a context that holds any 5000-character chunk.
ctx-size = 4096
embedding = 1
fit = off
flash-attn = on
load-mode = mmap
load-on-startup = true
n-gpu-layers = all
parallel = 1
; https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF#llamacpp
pooling = last
; Tensor split crashes for embeddings:
; ggml-backend-meta.cpp:1914: GGML_ASSERT(offset == 0) failed
split-mode = layer
; The output layer and its compute buffer are on the last GPU, so give the first GPU more layers.
tensor-split = 4,3
ubatch-size = 2048
