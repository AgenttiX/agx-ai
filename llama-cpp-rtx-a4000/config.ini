version = 1

[*]
host = 0.0.0.0
kv-unified = 1
; The LLM and the embedding model have to be loaded at the same time.
models-max = 2
models-preset = /etc/llama.cpp/preset.ini
no-ui = 1
port = 9931
; Unload the models from VRAM after 10 minutes of inactivity.
; The worker processes stay alive and keep ~600 MiB of VRAM each, and the models are reloaded on the next request.
sleep-idle-seconds = 600
; verbosity = 3
